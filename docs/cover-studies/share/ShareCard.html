<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Share Card</title>
<!-- Link-preview card (1200x630) built by scripts/BuildShareImages.mjs: the cover's finished greenhouse drawing,
     handed in as an image by the script, on the paper color. Not part of the site; open it only through the script. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500&family=Noto+Sans+KR:wght@500&display=block" rel="stylesheet">
<style>
  :root {
    --paper: #fbfbf8;
    --ink: #161616;
    --soft: #4d4d4a;
    --latin: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    --korean: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  }

  html,
  body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
  }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
  }

  /* KakaoTalk crops to about 2:1 around the center and other apps to a center square,
     so the greenhouse stays inside the middle 630x630 and everything inside the middle 1000x500. */
  .card__house {
    position: absolute;
    display: block;
  }

  .card[data-layout="bare"] .card__house {
    height: 480px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  .card[data-layout="text"] .card__house {
    height: 440px;
    left: 150px;
    top: 50%;
    transform: translateY(-50%);
  }

  .card__text {
    display: none;
  }

  .card[data-layout="text"] .card__text {
    position: absolute;
    display: flex;
    flex-direction: column;
    left: 660px;
    top: 50%;
    transform: translateY(-50%);
    gap: 22px;
  }

  .card__head {
    margin: 0;
    font-family: var(--latin);
    font-weight: 500;
    font-size: 46px;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .card__names {
    margin: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: var(--latin);
    font-weight: 500;
    font-size: 31px;
    letter-spacing: -0.01em;
  }

  .card__rings {
    width: 46px;
    height: 35px;
  }

  .card__when {
    margin: 10px 0 0;
    font-family: var(--korean);
    font-weight: 500;
    font-size: 25px;
    color: var(--soft);
    line-height: 1.5;
  }
</style>
</head>
<body>
<main class="card" data-layout="bare">
  <img class="card__house" alt="">
  <div class="card__text">
    <p class="card__head">WEDDING INVITATION</p>
    <p class="card__names">Seo Jinyong <img class="card__rings" alt=""> Jang Harim</p>
    <p class="card__when">2027.03.06 토요일 오후 5시<br>식물관PH</p>
  </div>
</main>
<script>
  // Alpha below this counts as empty canvas when trimming the drawing to its own edges.
  const ALPHA_THRESHOLD = 8;

  const loadImage = (source) => {
    return new Promise((resolve, reject) => {
      const image = new Image();

      image.onload = () => resolve(image);
      image.onerror = reject;
      image.src = source;
    });
  };

  // The cover canvas leaves room around the house; cut the picture to its drawn pixels.
  const trimToDrawing = async (source) => {
    const image = await loadImage(source);
    const canvas = document.createElement('canvas');

    canvas.width = image.naturalWidth;
    canvas.height = image.naturalHeight;

    const context = canvas.getContext('2d');

    context.drawImage(image, 0, 0);

    const { data, width, height } = context.getImageData(0, 0, canvas.width, canvas.height);
    let top = height;
    let bottom = -1;
    let left = width;
    let right = -1;

    for (let y = 0; y < height; y += 1) {
      for (let x = 0; x < width; x += 1) {
        if (data[(y * width + x) * 4 + 3] < ALPHA_THRESHOLD) {
          continue;
        }

        top = Math.min(top, y);
        bottom = Math.max(bottom, y);
        left = Math.min(left, x);
        right = Math.max(right, x);
      }
    }

    if (bottom < 0) {
      throw new Error('greenhouse canvas is empty');
    }

    const trimmed = document.createElement('canvas');

    trimmed.width = right - left + 1;
    trimmed.height = bottom - top + 1;
    trimmed.getContext('2d').drawImage(canvas, -left, -top);

    return trimmed.toDataURL('image/png');
  };

  // Called by the build script; resolves once the drawing, the rings and the fonts are all in place.
  window.renderCard = async ({ greenhouse, rings, layout }) => {
    const card = document.querySelector('.card');
    const house = document.querySelector('.card__house');
    const ringsImage = document.querySelector('.card__rings');

    card.dataset.layout = layout;
    house.src = await trimToDrawing(greenhouse);
    ringsImage.src = await trimToDrawing(rings);
    await Promise.all([house.decode(), ringsImage.decode(), document.fonts.ready]);

    const box = house.getBoundingClientRect();

    return { left: box.left, top: box.top, width: box.width, height: box.height };
  };
</script>
</body>
</html>
