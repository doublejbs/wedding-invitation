<style>
  /* Ceremony: laid out like the user's reference page. White paper, one centred column, no title:
     the date line and place open the section, then the month over a crayon line, the day circled
     in crayon, a countdown, then the calendar link (the kit's pill). The families are in the section after the greeting. */

  .ceremony {
    padding-block: 88px;
    text-align: center;
    font-family: var(--korean);
    font-size: 15px;
    font-weight: 400;
    line-height: 1.95;
    letter-spacing: -0.01em;
  }

  .ceremony p {
    margin: 0;
  }

  /* The date written out in Korean, the largest words in the section so it reads at a glance. */
  .ceremony .ceremony__when {
    font-family: var(--korean);
    font-size: clamp(21px, 6.2vw, 24px);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.45;
  }

  .ceremony .ceremony__place {
    margin-top: 4px;
    color: var(--soft);
    font-family: var(--korean);
    font-size: 17px;
    line-height: 1.6;
  }

  /* The month sits on the only rule in the section: a crayon line as wide as the grid. */
  .ceremony .calendar__month {
    max-width: 301px;
    margin: 50px auto 0;
    padding-bottom: 12px;
    background: var(--crayon-underline-ink) bottom center / 100% 8px no-repeat;
    font-family: var(--latin), var(--korean);
    font-size: clamp(19px, 5.6vw, 21px);
    font-weight: 500;
    line-height: 1.3;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  /* Numbers on paper: no table, no rules. */
  .calendar__grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    row-gap: 4px;
    max-width: 301px;
    margin: 16px auto 18px;
    font-family: var(--latin), var(--korean);
    font-variant-numeric: tabular-nums;
  }

  .calendar__weekday {
    color: var(--soft);
    font-family: var(--latin);
    font-size: 12px;
    line-height: 28px;
  }

  .calendar__day {
    font-size: 14px;
    font-weight: 500;
    line-height: 36px;
  }

  /* 1 March 2027 is a Monday, the second column. */
  .calendar__day--first {
    grid-column-start: 2;
  }

  .calendar__day--wedding {
    background: var(--crayon-circle) center / min(100%, 42px) 34px no-repeat;
  }

  /* Time left: four units in one row, separators level with the numbers. Hidden until the script runs. */
  .countdown {
    display: inline-flex;
    align-items: flex-start;
    justify-content: center;
    gap: 8px;
    margin-top: 22px;
    font-family: var(--latin), var(--korean);
  }

  .countdown[hidden] {
    display: none;
  }

  .countdown__unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 44px;
  }

  .countdown__value,
  .countdown__sep {
    font-size: 22px;
    font-weight: 500;
    line-height: 1.3;
    font-variant-numeric: tabular-nums;
  }

  .countdown__sep {
    color: var(--soft);
  }

  .countdown__label {
    color: var(--soft);
    font-size: 11px;
    line-height: 1.6;
    letter-spacing: 0.12em;
  }

  .calendar .calendar__add {
    margin-top: 28px;
  }
</style>

<script src="SectionKit.js"></script>
<script>
  // Add to calendar: without this script the link is the event file itself (share/wedding.ics).
  // Android often only downloads that file, so it gets Google Calendar's form instead. KakaoTalk's browser
  // on iPhone cannot open the file, so it hands the address over to Safari.
  (() => {
    const EVENT_TITLE = '서진용 · 장하림 결혼식';
    const EVENT_DATES = '20270306T080000Z/20270306T100000Z';
    const EVENT_PLACE = '식물관PH';
    const GOOGLE_CALENDAR_URL = 'https://calendar.google.com/calendar/render';
    const KAKAO_EXTERNAL_URL = 'kakaotalk://web/openExternal';
    const link = document.querySelector('.ceremony a[data-add-calendar]');

    if (!link) {
      return;
    }

    const userAgent = navigator.userAgent;

    if (/Android/i.test(userAgent)) {
      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: EVENT_TITLE,
        dates: EVENT_DATES,
        location: EVENT_PLACE,
      });

      link.href = `${GOOGLE_CALENDAR_URL}?${params}`;
      link.target = '_blank';
      link.rel = 'noopener';

      return;
    }

    if (/iPhone|iPad|iPod/i.test(userAgent) && /KAKAOTALK/i.test(userAgent)) {
      const fileUrl = new URL(link.getAttribute('href'), window.location.href).href;

      link.href = `${KAKAO_EXTERNAL_URL}?url=${encodeURIComponent(fileUrl)}`;
    }
  })();

  // Countdown to the ceremony, refreshed on each second. Hidden without the script and once it has begun.
  (() => {
    const WEDDING_TIME = Date.parse('2027-03-06T17:00:00+09:00');
    const MS_PER_SECOND = 1000;
    const countdown = document.querySelector('.ceremony .countdown');

    if (!countdown) {
      return;
    }

    const values = countdown.querySelectorAll('.countdown__value');
    const padTwo = (value) => String(value).padStart(2, '0');
    const handleTick = () => {
      const remaining = WEDDING_TIME - Date.now();

      if (remaining <= 0) {
        countdown.hidden = true;

        return;
      }

      const totalSeconds = Math.floor(remaining / MS_PER_SECOND);
      const parts = [
        String(Math.floor(totalSeconds / 86400)),
        padTwo(Math.floor(totalSeconds / 3600) % 24),
        padTwo(Math.floor(totalSeconds / 60) % 60),
        padTwo(totalSeconds % 60),
      ];

      parts.forEach((part, index) => {
        if (values[index]) {
          values[index].textContent = part;
        }
      });

      countdown.hidden = false;

      // Wake on the next whole second so the numbers change together with the clock.
      setTimeout(handleTick, remaining % MS_PER_SECOND || MS_PER_SECOND);
    };

    handleTick();
  })();
</script>
