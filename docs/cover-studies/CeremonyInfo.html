<link rel="stylesheet" href="SectionKit.css">
<style>
  /* Ceremony: in the cover's tone (tokens, container, title, pair and type sizes come from SectionKit.css).
     Three blocks with the cover's breathing room between them: the families facing each other like the
     cover's name row, the day facing its countdown like the cover's date row, then two or three sentences. */

  /* Families: pulled in from the edges by the same amount on both sides, like the cover's names
     hugging the rings. Bottom-aligned so the two names sit on one line. */
  .ceremony__families {
    padding-inline: clamp(0px, 5%, 20px);
  }

  .ceremony__family {
    display: grid;
    row-gap: 6px;
  }

  /* Parents' names are the quiet line; the couple's names are what the eye should land on.
     Every part of the line keeps the same weight (500): only size and the soft color set them apart. */
  .ceremony__parents {
    font-size: 13px;
    font-weight: 500;
    color: var(--soft);
    letter-spacing: 0;
  }

  .ceremony__relation {
    font-size: 15px;
    font-weight: 500;
    color: var(--soft);
    letter-spacing: -0.01em;
  }

  .ceremony__name {
    margin-left: 0.3em;
    font-size: clamp(18px, 5.2vw, 21px);
    font-weight: 500;
    color: var(--ink);
    letter-spacing: -0.02em;
  }

  /* Date row: the countdown leads on the left like the cover's 2027 / 03.06, the day reads on the right.
     The day keeps its right column even before the script runs, so the row never jumps sideways. */
  .ceremony__date {
    margin-top: 52px;
  }

  .ceremony__date > .sub {
    grid-column: 2;
  }

  .ceremony__date .sub span {
    display: block;
  }

  /* With no countdown (no script, or the day has passed) the day stands alone, so it moves to the center
     instead of leaving an empty left half. */
  .ceremony__date:has(> [data-dday-row][hidden]) {
    grid-template-columns: auto;
    justify-content: center;
  }

  .ceremony__date:has(> [data-dday-row][hidden]) > .sub {
    grid-column: 1;
    justify-self: center;
    text-align: center;
  }

  .ceremony .prose {
    margin-top: 48px;
  }
</style>

  <div class="pair ceremony__families">
    <p class="ceremony__family">
      <span class="ceremony__parents">서○○ · ○○○</span>
      <span><span class="ceremony__relation">의 아들</span><span class="ceremony__name">진용</span></span>
    </p>
    <p class="ceremony__family">
      <span class="ceremony__parents">장○○ · ○○○</span>
      <span><span class="ceremony__relation">의 딸</span><span class="ceremony__name">하림</span></span>
    </p>
  </div>

  <div class="pair ceremony__date">
    <!-- Hidden until the script counts the days, so a failed script shows the date alone.
         Screen readers skip an aria-label on a <p>, so the short mark on screen (D-107) is hidden from
         them and a spoken sentence sits next to it. -->
    <p class="lead" data-dday-row hidden><span data-dday aria-hidden="true" hidden></span><span class="visually-hidden" data-dday-spoken></span></p>
    <p class="sub"><span>2027년 3월 6일 토요일</span><span>오후 5시</span></p>
  </div>

  <!-- TODO: confirm how dinner is served (seated course or buffet) and adjust the second line. -->
  <p class="prose">
    예식은 식물관PH 온실에서 열립니다.<br>
    예식 후 저녁 식사를 준비했습니다.<br>
    조금 일찍 오셔서 온실을 둘러보세요.
  </p>
</section>

<script src="SectionKit.js"></script>
<script>
  // Countdown: calendar days left until the wedding, counted on Korean calendar dates (KST, UTC+9),
  // so a guest abroad sees the same number as a guest in Seoul.
  // The row stays hidden unless this script fills it, and once the day has passed it is hidden again.
  (() => {
    const WEDDING_YEAR = 2027;
    const WEDDING_MONTH_INDEX = 2;
    const WEDDING_DAY = 6;
    const DAY_MS = 24 * 60 * 60 * 1000;
    const KST_OFFSET_MS = 9 * 60 * 60 * 1000;
    const TODAY_LABEL = 'TODAY';
    const TODAY_SPOKEN = '오늘이 결혼식입니다';
    const row = document.querySelector('.ceremony [data-dday-row]');
    const dday = row ? row.querySelector('[data-dday]') : null;
    const spoken = row ? row.querySelector('[data-dday-spoken]') : null;

    if (!row || !dday || !spoken) {
      return;
    }

    // Shifting by nine hours and reading the UTC fields gives today's date in Korea, whatever the device's zone.
    const koreaNow = new Date(Date.now() + KST_OFFSET_MS);
    const today = Date.UTC(koreaNow.getUTCFullYear(), koreaNow.getUTCMonth(), koreaNow.getUTCDate());
    const wedding = Date.UTC(WEDDING_YEAR, WEDDING_MONTH_INDEX, WEDDING_DAY);
    const daysLeft = Math.round((wedding - today) / DAY_MS);

    if (daysLeft < 0) {
      row.hidden = true;
      dday.hidden = true;

      return;
    }

    if (daysLeft === 0) {
      dday.textContent = TODAY_LABEL;
      spoken.textContent = TODAY_SPOKEN;
    } else {
      dday.textContent = `D-${daysLeft}`;
      spoken.textContent = `결혼식까지 ${daysLeft}일`;
    }

    dday.hidden = false;
    row.hidden = false;
  })();
</script>
