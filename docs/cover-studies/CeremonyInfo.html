<style>
  /* Ceremony: reference layout in the cover tone (tokens, title, drawing and type sizes come from SectionKit.css).
     One centered column: the title, the two families stacked, the date and time under a small label,
     the countdown, then two or three sentences. */

  /* Families: one row each, the parents small and soft, the name large, sharing a baseline. */
  .ceremony__families {
    margin: 0;
    display: grid;
    row-gap: 14px;
    justify-items: center;
  }

  .ceremony__family {
    margin: 0;
    display: flex;
    align-items: baseline;
    justify-content: center;
    column-gap: 0.9em;
    white-space: nowrap;
  }

  .ceremony__parents {
    font-family: var(--korean);
    font-size: clamp(13.5px, 3.9vw, 15.5px);
    font-weight: 500;
    line-height: 1.3;
    color: var(--soft);
  }

  .ceremony__name {
    font-family: var(--latin), var(--korean);
    font-size: clamp(24px, 7vw, 27px);
    font-weight: 500;
    line-height: 1.15;
    color: var(--ink);
    letter-spacing: -0.02em;
  }

  /* Date and time under a small soft label. */
  .ceremony__when {
    margin-top: 52px;
    text-align: center;
  }

  .ceremony__label {
    margin: 0 0 12px;
    font-family: var(--korean);
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--soft);
  }

  .ceremony__datetime {
    margin: 0;
    font-family: var(--korean);
    font-size: clamp(19px, 5.4vw, 22px);
    font-weight: 500;
    line-height: 1.5;
    color: var(--ink);
  }

  .ceremony__datetime span {
    display: block;
  }

  /* Countdown: the D-day mark, then the running time. Tabular digits padded to two places,
     so the line never changes width while it ticks. */
  .ceremony__countdown {
    margin-top: 28px;
    text-align: center;
  }

  .ceremony__countdown [data-dday-row] {
    margin: 0;
    font-family: var(--latin), var(--korean);
    font-size: clamp(22px, 6.4vw, 26px);
    font-weight: 500;
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  .ceremony__timer {
    margin: 8px 0 0;
    font-family: var(--korean);
    font-size: 15.5px;
    font-weight: 500;
    color: var(--soft);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .ceremony__timer b {
    font-weight: 500;
    color: var(--ink);
  }

  .ceremony .prose {
    margin-top: 48px;
    font-size: 14.5px;
  }
</style>

  </div>

  <div class="ceremony__countdown">
    <!-- Hidden until the script counts, so a failed script shows the date alone.
         Screen readers skip an aria-label on a <p>, so the short mark (D-107) and the ticking line are
         hidden from them and one spoken sentence sits next to the mark. -->
    <p data-dday-row hidden><span data-dday aria-hidden="true" hidden></span><span class="visually-hidden" data-dday-spoken></span></p>
    <p class="ceremony__timer" data-countdown aria-hidden="true" hidden></p>
  </div>

  <!-- TODO: confirm how dinner is served (seated course or buffet) and adjust the second line. -->
  <p class="prose">
    예식은 식물관PH 온실에서 열립니다.<br>
    예식 후 저녁 식사를 준비했습니다.<br>
    조금 일찍 오셔서 온실을 둘러보세요.
  </p>

<script src="SectionKit.js"></script>
<script>
  // Countdown: calendar days left until the wedding, counted on Korean calendar dates (KST, UTC+9),
  // so a guest abroad sees the same number as a guest in Seoul.
  // The row stays hidden unless this script fills it, and once the day has passed it is hidden again.
  (() => {
    const WEDDING_YEAR = 2027;
    const WEDDING_MONTH_INDEX = 2;
    const WEDDING_DAY = 6;
    const DAY_MS = 24 * 60 * 60 * 1000;
    const KST_OFFSET_MS = 9 * 60 * 60 * 1000;
    const TODAY_LABEL = 'TODAY';
    const TODAY_SPOKEN = '오늘이 결혼식입니다';
    const row = document.querySelector('.ceremony [data-dday-row]');
    const dday = row ? row.querySelector('[data-dday]') : null;
    const spoken = row ? row.querySelector('[data-dday-spoken]') : null;

    if (!row || !dday || !spoken) {
      return;
    }

    // Shifting by nine hours and reading the UTC fields gives today's date in Korea, whatever the device's zone.
    const koreaNow = new Date(Date.now() + KST_OFFSET_MS);
    const today = Date.UTC(koreaNow.getUTCFullYear(), koreaNow.getUTCMonth(), koreaNow.getUTCDate());
    const wedding = Date.UTC(WEDDING_YEAR, WEDDING_MONTH_INDEX, WEDDING_DAY);
    const daysLeft = Math.round((wedding - today) / DAY_MS);

    if (daysLeft < 0) {
      row.hidden = true;
      dday.hidden = true;

      return;
    }

    if (daysLeft === 0) {
      dday.textContent = TODAY_LABEL;
      spoken.textContent = TODAY_SPOKEN;
    } else {
      dday.textContent = `D-${daysLeft}`;
      spoken.textContent = `결혼식까지 ${daysLeft}일`;
    }

    dday.hidden = false;
    row.hidden = false;
  })();

  // Running countdown to the ceremony's start (17:00 KST), ticking every second; hidden from the start on.
  (() => {
    const CEREMONY_START_MS = Date.parse('2027-03-06T17:00:00+09:00');
    const TICK_MS = 1000;
    const timer = document.querySelector('.ceremony [data-countdown]');

    if (!timer) {
      return;
    }

    const pad = (value) => {
      return String(value).padStart(2, '0');
    };

    let intervalId = null;

    const stop = () => {
      if (intervalId !== null) {
        clearInterval(intervalId);
        intervalId = null;
      }
    };

    const render = () => {
      const totalSeconds = Math.ceil((CEREMONY_START_MS - Date.now()) / TICK_MS);

      if (totalSeconds <= 0) {
        timer.hidden = true;
        stop();

        return false;
      }

      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      timer.innerHTML = `<b>${days}</b>일 <b>${pad(hours)}</b>시간 <b>${pad(minutes)}</b>분 <b>${pad(seconds)}</b>초`;
      timer.hidden = false;

      return true;
    };

    const start = () => {
      stop();

      if (render()) {
        intervalId = setInterval(render, TICK_MS);
      }
    };

    // Pause while the page is in the background; catch up at once when it comes back.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stop();

        return;
      }

      start();
    });

    start();
  })();
</script>
