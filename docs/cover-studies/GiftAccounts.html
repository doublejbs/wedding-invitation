<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>진용·하림 마음 전하실 곳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="SectionKit.css">
<style>
  /* Gift: in the cover's tone (tokens, container, title, toggles and copy words come from SectionKit.css).
     One sentence, then 신랑측 and 신부측 facing each other; each opens its own accounts right below it. */

  /* The Korean title word is the longest of all sections; keep it on one line so the
     envelope stays on the center axis instead of the word wrapping under itself. */
  .gift .section-title__right {
    white-space: nowrap;
  }

  .gift__toggles {
    margin-top: 28px;
    align-items: center;
  }

  /* Pull each toggle's crayon mark back to the column edge, so the word lines up with the accounts below it. */
  .gift__toggles > :first-child {
    margin-left: -14px;
  }

  .gift__toggles > :last-child {
    margin-right: -14px;
  }

  /* An open side unfolds under its own word: the groom's to the left, the bride's to the right. */
  .gift__panel {
    margin-top: 14px;
  }

  .gift__panel--bride {
    text-align: right;
  }

  .gift__accounts {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .gift__account {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .gift__account + .gift__account {
    margin-top: 10px;
  }

  .gift__panel--bride .gift__account {
    align-items: flex-end;
  }

  .gift__account .label {
    line-height: 1.5;
  }

  /* The number line is one tap target; it never wraps, so a number is always read in one piece. */
  .gift__number {
    font-size: 15px;
    letter-spacing: -0.01em;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* Without the script both sides stay open (the markup ships unfolded so the accounts are never lost).
     The words do nothing then, so they read as plain headings: no circle, no underline. */
  .gift:not([data-gift-ready]) .crayon-toggle {
    background-image: none;
    cursor: default;
  }

  /* Opening is shown by the crayon circle; the accounts only fade in a little, and only for those who allow motion. */
  @media (prefers-reduced-motion: no-preference) {
    .gift__panel:not([hidden]) {
      animation: gift-unfold 320ms ease-out;
    }
  }

  @keyframes gift-unfold {
    from {
      opacity: 0;
      transform: translateY(-4px);
    }

    to {
      opacity: 1;
      transform: none;
    }
  }
</style>

<section class="section gift" aria-label="마음 전하실 곳">
  <h2 class="section-title" aria-label="Gift, 마음 전하실 곳">
    <span class="section-title__left" aria-hidden="true">GIFT</span>
    <svg class="section-title__glyph" viewBox="0 0 48 36" aria-hidden="true">
      <!-- A crayon envelope: white body in a wobbly pencil outline, the folded flap, one round gold seal.
           Like the greenhouse frame in LOCATION: a soft first pass, then a paler second pass a little off it. -->
      <path d="M5.2 8.6 C 16 7.9, 31 8.4, 42.9 7.8 C 43.3 15, 42.8 23, 43.2 29.6 C 31 30.3, 17 29.8, 4.8 30.2 C 5.3 23, 4.7 15, 5.2 8.6 Z" fill="#ffffff" stroke="#3a3a37" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.7"/>
      <path d="M5.7 8.1 C 17 8.5, 30 7.6, 42.4 8.4 C 42.7 16, 43.6 23, 42.6 30.1 C 30 29.6, 18 30.6, 5.4 29.6 C 4.6 22, 5.5 15, 4.9 9.2" fill="none" stroke="#3a3a37" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
      <path d="M5.6 9.2 C 11 13.5, 17.5 18, 24 20.6 C 30.5 18, 37 13.4, 42.4 8.6" fill="none" stroke="#3a3a37" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
      <path d="M6.2 8.7 C 12 13.2, 18 17.4, 24.3 20 C 30 17.6, 36.4 13.6, 42.8 9.3" fill="none" stroke="#3a3a37" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
      <path d="M5.8 29.4 C 10.5 26.4, 14.5 24, 18.6 22 M42.6 29.2 C 38 26.2, 33.8 23.8, 29.6 21.9" fill="none" stroke="#3a3a37" stroke-width="0.7" stroke-linecap="round" opacity="0.45"/>
      <path d="M24.4 14.4 C 28.2 14.5, 30.4 17.4, 30.2 20.9 C 30 24.3, 27.3 26.6, 23.8 26.5 C 20.3 26.3, 17.8 23.8, 17.9 20.3 C 18.1 16.9, 20.8 14.3, 24.4 14.4 Z" fill="#c9a24d"/>
      <path d="M20.6 19.2 C 22 17.2, 24.8 16.5, 27.2 17.9 M20.9 22.9 C 22.8 24.4, 25.8 24.4, 27.7 22.4" fill="none" stroke="#e8c65a" stroke-width="0.9" stroke-linecap="round"/>
    </svg>
    <span class="section-title__right" aria-hidden="true">마음 전하실 곳</span>
  </h2>

  <p class="prose">참석이 어려우신 분들을 위해<br>계좌번호를 적어 둡니다.</p>

  <p class="pair sub gift__toggles">
    <button class="crayon-toggle" type="button" data-side-toggle="groom" aria-expanded="true" aria-controls="gift-groom-accounts">신랑측</button>
    <button class="crayon-toggle" type="button" data-side-toggle="bride" aria-expanded="true" aria-controls="gift-bride-accounts">신부측</button>
  </p>

  <div class="gift__panel gift__panel--groom" id="gift-groom-accounts" data-side-panel="groom" role="region" aria-label="신랑측 계좌">
    <!-- TODO: fill in the real bank names and account numbers (button text, data-copy and aria-label),
         and the parents' names. data-copy holds the account number only, without the bank name.
         KakaoPay / Toss links, once received, go next to each account as a word. -->
    <ul class="gift__accounts">
      <li class="gift__account">
        <span class="label">신랑 서진용</span>
        <button class="crayon-link gift__number" type="button" data-copy="000-0000-0000-00" aria-label="계좌번호 복사: 신랑 서진용, ○○은행 000-0000-0000-00">○○은행 000-0000-0000-00</button>
      </li>
      <li class="gift__account">
        <span class="label">아버지 서○○</span>
        <button class="crayon-link gift__number" type="button" data-copy="000-0000-0000-00" aria-label="계좌번호 복사: 아버지 서○○, ○○은행 000-0000-0000-00">○○은행 000-0000-0000-00</button>
      </li>
      <li class="gift__account">
        <span class="label">어머니 ○○○</span>
        <button class="crayon-link gift__number" type="button" data-copy="000-0000-0000-00" aria-label="계좌번호 복사: 어머니 ○○○, ○○은행 000-0000-0000-00">○○은행 000-0000-0000-00</button>
      </li>
    </ul>
  </div>

  <div class="gift__panel gift__panel--bride" id="gift-bride-accounts" data-side-panel="bride" role="region" aria-label="신부측 계좌">
    <!-- TODO: fill in the real bank names and account numbers (button text, data-copy and aria-label),
         and the parents' names. data-copy holds the account number only, without the bank name. -->
    <ul class="gift__accounts">
      <li class="gift__account">
        <span class="label">신부 장하림</span>
        <button class="crayon-link gift__number" type="button" data-copy="000-0000-0000-00" aria-label="계좌번호 복사: 신부 장하림, ○○은행 000-0000-0000-00">○○은행 000-0000-0000-00</button>
      </li>
      <li class="gift__account">
        <span class="label">아버지 장○○</span>
        <button class="crayon-link gift__number" type="button" data-copy="000-0000-0000-00" aria-label="계좌번호 복사: 아버지 장○○, ○○은행 000-0000-0000-00">○○은행 000-0000-0000-00</button>
      </li>
      <li class="gift__account">
        <span class="label">어머니 ○○○</span>
        <button class="crayon-link gift__number" type="button" data-copy="000-0000-0000-00" aria-label="계좌번호 복사: 어머니 ○○○, ○○은행 000-0000-0000-00">○○은행 000-0000-0000-00</button>
      </li>
    </ul>
  </div>
</section>

<script src="SectionKit.js"></script>
<script>
  // Side toggles: one side's accounts open at a time; tapping the open side folds it again.
  // The markup ships with both sides open so the accounts show without script; this folds them first.
  // Copying an account number is handled by SectionKit.js (button[data-copy]).
  (() => {
    const section = document.querySelector('.gift');

    if (!section) {
      return;
    }

    const toggles = [...section.querySelectorAll('button[data-side-toggle]')];

    const setOpen = (toggle, isOpen) => {
      const panel = section.querySelector(`[data-side-panel="${toggle.dataset.sideToggle}"]`);

      toggle.setAttribute('aria-expanded', String(isOpen));

      if (panel) {
        panel.hidden = !isOpen;
      }
    };

    const handleToggleClick = (event) => {
      const clicked = event.currentTarget;
      const willOpen = clicked.getAttribute('aria-expanded') !== 'true';

      toggles.forEach((toggle) => {
        setOpen(toggle, toggle === clicked && willOpen);
      });
    };

    toggles.forEach((toggle) => {
      setOpen(toggle, false);
      toggle.addEventListener('click', handleToggleClick);
    });
    section.setAttribute('data-gift-ready', '');
  })();
</script>
