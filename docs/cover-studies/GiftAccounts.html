<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>진용·하림 마음 전하실 곳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="SectionKit.css">
<style>
  /* Gift: laid out like the ceremony (tokens, title, toggles and copy words come from SectionKit.css).
     One sentence, then 신랑측 and 신부측 side by side on the centre axis; each opens its accounts below. */

  .gift__toggles {
    margin: 24px 0 0;
    display: flex;
    justify-content: center;
    gap: 28px;
    font-size: 15px;
    letter-spacing: -0.01em;
  }

  .gift__panel {
    margin-top: 18px;
  }

  .gift__accounts {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .gift__account {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .gift__account + .gift__account {
    margin-top: 12px;
  }

  .gift__account .label {
    line-height: 1.6;
  }

  /* The number line is one tap target; it never wraps, so a number is always read in one piece. */
  .gift__number {
    font-size: 15px;
    letter-spacing: -0.01em;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* Without the script both sides stay open (the markup ships unfolded so the accounts are never lost).
     The words do nothing then, so they read as plain headings: no circle, no underline. */
  .gift:not([data-gift-ready]) .crayon-toggle {
    background-image: none;
    cursor: default;
  }

  /* Opening is shown by the crayon circle; the accounts only fade in a little, and only for those who allow motion. */
  @media (prefers-reduced-motion: no-preference) {
    .gift__panel:not([hidden]) {
      animation: gift-unfold 320ms ease-out;
    }
  }

  @keyframes gift-unfold {
    from {
      opacity: 0;
      transform: translateY(-4px);
    }

    to {
      opacity: 1;
      transform: none;
    }
  }
</style>

<section class="section section--detail gift" aria-label="마음 전하실 곳">
  <h2 class="section-title">마음 전하실 곳</h2>

  <p class="prose">참석이 어려우신 분들을 위해<br>계좌번호를 적어 둡니다.</p>

  <p class="gift__toggles">
    <button class="crayon-toggle" type="button" data-side-toggle="groom" aria-expanded="true" aria-controls="gift-groom-accounts">신랑측</button>
    <button class="crayon-toggle" type="button" data-side-toggle="bride" aria-expanded="true" aria-controls="gift-bride-accounts">신부측</button>
  </p>

  <div class="gift__panel gift__panel--groom" id="gift-groom-accounts" data-side-panel="groom" role="region" aria-label="신랑측 계좌">
    <!-- TODO: fill in the real bank names and account numbers (button text, data-copy and aria-label),
         and the parents' names. data-copy holds the account number only, without the bank name.
         KakaoPay / Toss links, once received, go next to each account as a word. -->
    <ul class="gift__accounts">
      <li class="gift__account">
        <span class="label">신랑 서진용</span>
        <button class="crayon-link gift__number" type="button" data-copy="000-0000-0000-00" aria-label="계좌번호 복사: 신랑 서진용, ○○은행 000-0000-0000-00">○○은행 000-0000-0000-00</button>
      </li>
      <li class="gift__account">
        <span class="label">아버지 서○○</span>
        <button class="crayon-link gift__number" type="button" data-copy="000-0000-0000-00" aria-label="계좌번호 복사: 아버지 서○○, ○○은행 000-0000-0000-00">○○은행 000-0000-0000-00</button>
      </li>
      <li class="gift__account">
        <span class="label">어머니 ○○○</span>
        <button class="crayon-link gift__number" type="button" data-copy="000-0000-0000-00" aria-label="계좌번호 복사: 어머니 ○○○, ○○은행 000-0000-0000-00">○○은행 000-0000-0000-00</button>
      </li>
    </ul>
  </div>

  <div class="gift__panel gift__panel--bride" id="gift-bride-accounts" data-side-panel="bride" role="region" aria-label="신부측 계좌">
    <!-- TODO: fill in the real bank names and account numbers (button text, data-copy and aria-label),
         and the parents' names. data-copy holds the account number only, without the bank name. -->
    <ul class="gift__accounts">
      <li class="gift__account">
        <span class="label">신부 장하림</span>
        <button class="crayon-link gift__number" type="button" data-copy="000-0000-0000-00" aria-label="계좌번호 복사: 신부 장하림, ○○은행 000-0000-0000-00">○○은행 000-0000-0000-00</button>
      </li>
      <li class="gift__account">
        <span class="label">아버지 장○○</span>
        <button class="crayon-link gift__number" type="button" data-copy="000-0000-0000-00" aria-label="계좌번호 복사: 아버지 장○○, ○○은행 000-0000-0000-00">○○은행 000-0000-0000-00</button>
      </li>
      <li class="gift__account">
        <span class="label">어머니 ○○○</span>
        <button class="crayon-link gift__number" type="button" data-copy="000-0000-0000-00" aria-label="계좌번호 복사: 어머니 ○○○, ○○은행 000-0000-0000-00">○○은행 000-0000-0000-00</button>
      </li>
    </ul>
  </div>
</section>

<script src="SectionKit.js"></script>
<script>
  // Side toggles: one side's accounts open at a time; tapping the open side folds it again.
  // The markup ships with both sides open so the accounts show without script; this folds them first.
  // Copying an account number is handled by SectionKit.js (button[data-copy]).
  (() => {
    const section = document.querySelector('.gift');

    if (!section) {
      return;
    }

    const toggles = [...section.querySelectorAll('button[data-side-toggle]')];

    const setOpen = (toggle, isOpen) => {
      const panel = section.querySelector(`[data-side-panel="${toggle.dataset.sideToggle}"]`);

      toggle.setAttribute('aria-expanded', String(isOpen));

      if (panel) {
        panel.hidden = !isOpen;
      }
    };

    const handleToggleClick = (event) => {
      const clicked = event.currentTarget;
      const willOpen = clicked.getAttribute('aria-expanded') !== 'true';

      toggles.forEach((toggle) => {
        setOpen(toggle, toggle === clicked && willOpen);
      });
    };

    toggles.forEach((toggle) => {
      setOpen(toggle, false);
      toggle.addEventListener('click', handleToggleClick);
    });
    section.setAttribute('data-gift-ready', '');
  })();
</script>
