<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>진용·하림 온실 커버</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Layout: one white sheet; a left-aligned sentence headline, a crayon greenhouse that fills with plants, big date numerals.
     Single look on purpose (a printed card on white stock), so no dark theme. */
  /* Stand-ins while the web fonts load: system faces scaled to the widths and line metrics of Archivo 500 and
     Noto Sans KR, so the cover's lines keep their length and place when the real fonts swap in. Each one only
     applies where its system font exists (Helvetica Neue on iPhone and Mac, Roboto on Android, Apple SD Gothic Neo
     on iPhone and Mac); browsers without size-adjust or the overrides simply get the plain system font as before. */
  @font-face {
    font-family: 'Archivo Fallback Helvetica';
    src: local('Helvetica Neue Medium'), local('HelveticaNeue-Medium');
    font-weight: 500;
    size-adjust: 101.9%;
    ascent-override: 86.4%;
    descent-override: 20.6%;
    line-gap-override: 0%;
  }

  /* The word space is much wider in the system faces than in Archivo, so it gets its own scale (a later face wins
     for the characters in its unicode-range). */
  @font-face {
    font-family: 'Archivo Fallback Helvetica';
    src: local('Helvetica Neue Medium'), local('HelveticaNeue-Medium');
    font-weight: 500;
    unicode-range: U+20;
    size-adjust: 63.5%;
    ascent-override: 138.6%;
    descent-override: 33.1%;
    line-gap-override: 0%;
  }

  @font-face {
    font-family: 'Archivo Fallback Roboto';
    src: local('Roboto Medium'), local('Roboto-Medium');
    font-weight: 500;
    size-adjust: 104.3%;
    ascent-override: 84.4%;
    descent-override: 20.1%;
    line-gap-override: 0%;
  }

  @font-face {
    font-family: 'Archivo Fallback Roboto';
    src: local('Roboto Medium'), local('Roboto-Medium');
    font-weight: 500;
    unicode-range: U+20;
    size-adjust: 70%;
    ascent-override: 125.7%;
    descent-override: 30%;
    line-gap-override: 0%;
  }

  @font-face {
    font-family: 'Noto Sans KR Fallback';
    src: local('Apple SD Gothic Neo Regular'), local('AppleSDGothicNeo-Regular');
    font-weight: 400;
    size-adjust: 106.4%;
    ascent-override: 109%;
    descent-override: 27.3%;
    line-gap-override: 0%;
  }

  @font-face {
    font-family: 'Noto Sans KR Fallback';
    src: local('Apple SD Gothic Neo Medium'), local('AppleSDGothicNeo-Medium');
    font-weight: 500;
    size-adjust: 106.4%;
    ascent-override: 109%;
    descent-override: 27.3%;
    line-gap-override: 0%;
  }

  @font-face {
    font-family: 'Noto Sans KR Fallback';
    src: local('Apple SD Gothic Neo Bold'), local('AppleSDGothicNeo-Bold');
    font-weight: 700;
    size-adjust: 106.4%;
    ascent-override: 109%;
    descent-override: 27.3%;
    line-gap-override: 0%;
  }

  :root {
    color-scheme: light;
    --paper: #fbfbf8;
    --ink: #161616;
    --soft: #4d4d4a;
    --latin: 'Archivo', 'Archivo Fallback Helvetica', 'Archivo Fallback Roboto', 'Helvetica Neue', Arial, sans-serif;
    --korean: 'Noto Sans KR', 'Noto Sans KR Fallback', 'Apple SD Gothic Neo', sans-serif;
  }

  html,
  body {
    height: 100%;
  }

  body {
    /* Paper grain taken from the stamp paper (textures/paper.png: a seamless 400px tile shown at 200px,
       so it stays fine on high-density screens). The flat colour shows until it loads. */
    background: var(--paper) url("textures/paper.png") 0 0 / 200px 200px repeat;
    color: var(--ink);
    font-family: var(--korean);
  }

  .card {
    min-height: 100%;
    box-sizing: border-box;
    max-width: 440px;
    margin: 0 auto;
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
    padding-block: 44px 40px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Live weather layer: drawn over the greenhouse, under the title and the date. */
  .weather {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
    /* Hidden until the greenhouse intro starts, then a soft fade in (data-weather="on", set by the weather script). */
    opacity: 0;
    transition: opacity 600ms ease-out;
  }

  .weather[data-weather="on"] {
    opacity: 1;
  }

  @media (prefers-reduced-motion: reduce) {
    .weather {
      transition: none;
    }
  }

  .card > .house {
    position: relative;
    z-index: 1;
  }

  .card > .title,
  .card > .details {
    position: relative;
    z-index: 3;
  }

  /* Title: two lines around a shared center: rings on the first, the ampersand on the second. */
  .title {
    margin: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    column-gap: 0.28em;
    font-family: var(--latin);
    font-weight: 500;
    /* Two of the widest side words (INVITATION) plus the middle column come to about 12.6em. */
    font-size: clamp(20px, calc((100vw - 48px) / 12.6), 33px);
    line-height: 1.18;
    letter-spacing: -0.035em;
  }

  .glyph {
    display: inline-block;
    width: 1.25em;
    height: 0.95em;
    margin: 0 0.04em;
    vertical-align: -0.12em;
  }

  .glyph--wide {
    width: 1.6em;
  }


  /* Three columns across the full width: outer words sit flush against the left and right edges,
     so both lines share the same edges, and the rings and the ampersand share the center axis. */
  .title__left,
  .title__right,
  .title__mid {
    white-space: nowrap;
  }

  .title__left {
    justify-self: start;
  }

  .title__right {
    justify-self: end;
  }

  .title__mid {
    justify-self: center;
  }

  /* First line spans all three columns, centered on the same axis as the rings. */
  .title__head {
    grid-column: 1 / -1;
    justify-self: center;
    white-space: nowrap;
  }

  /* Names are set smaller than the title so the second line reads as a caption under it. */
  .title__names {
    margin-top: 0.5em;
    font-size: 0.68em;
    letter-spacing: -0.02em;
  }

  /* Pull the two names in toward the rings, by the same amount on each side, so the row ends
     where WEDDING INVITATION ends. */
  .title__left.title__names {
    margin-left: 1.5em;
  }

  .title__right.title__names {
    margin-right: 1.5em;
  }

  /* Each name is a small stack: the English name with its Korean name centered beneath it. */
  .name {
    display: inline-grid;
    justify-items: center;
  }

  .name__ko {
    margin-top: 0.5em;
    font-family: var(--korean);
    font-size: 0.62em;
    font-weight: 500;
    letter-spacing: 0;
    color: var(--soft);
  }

  /* The rings sit at the vertical middle of the English and Korean names together. */
  .title__amp {
    align-self: center;
    width: 1.85em;
    height: 1.41em;
  }

  /* Rings with a soft twinkle: two four-point glints over the stone and the right ring. */
  .ring {
    position: relative;
    display: block;
  }

  .ring__art {
    display: block;
    width: 100%;
    height: 100%;
    margin: 0;
  }

  .ring__spark {
    position: absolute;
    left: 30%;
    top: 4%;
    width: 0.62em;
    height: 0.62em;
    /* Gold glint with a bright core, so it shows on the white paper. */
    background: radial-gradient(circle, #fffbe6 0 14%, #f3cf62 30%, #d4a23a 52%, rgba(212, 162, 58, 0) 74%);
    clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%);
    opacity: 0.85;
    pointer-events: none;
  }

  .ring__spark--small {
    left: 74%;
    top: 34%;
    width: 0.42em;
    height: 0.42em;
    opacity: 0.75;
  }

  @media (prefers-reduced-motion: no-preference) {
    .ring__spark {
      animation: twinkle 2.6s ease-in-out infinite;
    }

    .ring__spark--small {
      animation-delay: 1.3s;
    }
  }

  @keyframes twinkle {
    0%, 100% {
      opacity: 0;
      transform: scale(0.3) rotate(0deg);
    }

    45% {
      opacity: 1;
      transform: scale(1) rotate(25deg);
    }

    70% {
      opacity: 0;
      transform: scale(0.5) rotate(45deg);
    }
  }



  .house {
    flex: 1;
    min-height: 300px;
    display: grid;
    place-items: center;
    margin-block: 14px;
  }

  .house canvas {
    display: block;
    width: min(100%, 350px);
    max-width: 100%;
    aspect-ratio: 1 / 1.02;
    cursor: pointer;
  }

  /* The date is the second big moment: large numerals on the left, the rest set small beside them. */
  .details {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }

  /* The year over the day, both the same size and weight in the title's face. */
  .details__date {
    margin: 0;
    font-family: var(--latin);
    font-weight: 500;
    font-size: clamp(22px, 6.4vw, 26px);
    line-height: 1.08;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  /* Time and place match the date's face and weight, a step smaller so the date leads. */
  .details__rest {
    margin: 0;
    text-align: right;
    font-family: var(--latin), var(--korean);
    font-size: clamp(18px, 5.2vw, 21px);
    line-height: 1.25;
    font-weight: 500;
    letter-spacing: -0.02em;
  }

  .details__rest span {
    display: block;
  }

</style>

<main class="card" aria-label="커버">
  <canvas class="weather" id="weather" aria-hidden="true"></canvas>
  <h1 class="title" aria-label="WEDDING INVITATION, Seo Jinyong and Jang Harim">
    <span class="title__head">WEDDING INVITATION</span>
    <span class="title__left title__names"><span class="name">Seo Jinyong<span class="name__ko" lang="ko">서진용</span></span></span>
    <span class="title__mid title__names title__amp ring" aria-hidden="true">
      <canvas class="glyph ring__art" data-glyph="rings"></canvas>
      <span class="ring__spark"></span>
      <span class="ring__spark ring__spark--small"></span>
    </span>
    <span class="title__right title__names"><span class="name">Jang Harim<span class="name__ko" lang="ko">장하림</span></span></span>
  </h1>

  <div class="house">
    <canvas id="greenhouse" role="img" aria-label="크레파스로 그린 유리 온실 안이 야자수와 붉은 꽃으로 가득 차고, 가운데로 흰 버진로드가 나 있는 그림"></canvas>
  </div>


  <div class="details">
    <p class="details__date" aria-label="2027년 3월 6일">
      2027<br>03.06
    </p>
    <p class="details__rest">
      <span>토요일 오후 5시</span>
      <span>식물관PH</span>
    </p>
  </div>
</main>

<script>
  // Crayon greenhouse. Everything comes from a seeded random generator, so every visit draws the same picture.
  const CANVAS = document.getElementById('greenhouse');
  const MAIN_CONTEXT = CANVAS.getContext('2d');
  // The drawing helpers paint on CONTEXT; the title glyphs borrow them by pointing it at their own canvas.
  let CONTEXT = MAIN_CONTEXT;
  const SEED = 20270306;
  const GREENS = ['#2f7d4a', '#4f9a3e', '#7fb069', '#3d6e5f', '#97c160', '#5b8f7b'];
  // Red family: poppy red, deep crimson, coral, and a soft rose so the aisle doesn't read as one block.
  const BLOOMS = ['#d8433b', '#b02a33', '#e8735f', '#f0a99c'];
  const FRAME_COLOR = '#7f8b8a';
  const FRAME_MS = 500;
  const POP_MS = 320;
  const STAGGER_MS = 14;

  const createRandom = (seed) => {
    let state = seed >>> 0;

    return () => {
      state = (state + 0x6d2b79f5) >>> 0;
      let t = state;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  const pick = (list, random) => {
    return list[Math.floor(random() * list.length)];
  };

  // Front view of the glass house: walls plus a gable roof, in canvas pixels.
  const buildHouse = (width, height) => {
    const left = width * 0.07;
    const right = width * 0.93;
    const base = height * 0.95;
    const eave = height * 0.42;
    const apex = height * 0.1;
    const center = width / 2;

    return { left, right, base, eave, apex, center, width, height };
  };

  const isInsideHouse = (house, x, y, margin) => {
    if (x < house.left + margin || x > house.right - margin || y > house.base - margin * 0.3) {
      return false;
    }

    if (y >= house.eave) {
      return true;
    }

    const half = (house.right - house.left) / 2;
    const roofHalf = half * ((y - house.apex) / (house.eave - house.apex));

    return Math.abs(x - house.center) <= roofHalf - margin;
  };

  // The white aisle runs from the front door toward the altar and narrows with distance.
  const aisleHalfWidth = (house, y) => {
    const t = Math.max(0, Math.min((y - house.height * 0.56) / (house.base - house.height * 0.56), 1));

    return house.width * (0.012 + t * 0.075);
  };

  const isOnAisle = (house, x, y, pad) => {
    if (y < house.height * 0.56) {
      return false;
    }

    return Math.abs(x - house.center) < aisleHalfWidth(house, y) + pad;
  };

  // A wobbly crayon line: two jittered passes on top of each other.
  const crayonLine = (x1, y1, x2, y2, lineWidth, color, random) => {
    const length = Math.hypot(x2 - x1, y2 - y1);
    const steps = Math.max(3, Math.round(length / 9));

    CONTEXT.strokeStyle = color;
    CONTEXT.lineCap = 'round';
    CONTEXT.lineJoin = 'round';

    for (let pass = 0; pass < 2; pass += 1) {
      CONTEXT.globalAlpha = pass === 0 ? 0.85 : 0.45;
      CONTEXT.lineWidth = lineWidth * (pass === 0 ? 1 : 0.7);
      CONTEXT.beginPath();
      CONTEXT.moveTo(x1 + (random() - 0.5) * 1.6, y1 + (random() - 0.5) * 1.6);

      for (let step = 1; step <= steps; step += 1) {
        const t = step / steps;
        CONTEXT.lineTo(x1 + (x2 - x1) * t + (random() - 0.5) * 1.8, y1 + (y2 - y1) * t + (random() - 0.5) * 1.8);
      }

      CONTEXT.stroke();
    }

    CONTEXT.globalAlpha = 1;
  };

  const drawFrame = (house, progress) => {
    const random = createRandom(SEED + 11);
    const { left, right, base, eave, apex, center } = house;
    const lines = [
      [left, base, left, eave],
      [right, base, right, eave],
      [left, eave, center, apex],
      [right, eave, center, apex],
      [left, base, right, base],
      [left, eave, right, eave],
    ];
    const columns = 6;

    for (let index = 1; index < columns; index += 1) {
      const x = left + ((right - left) * index) / columns;
      const half = (right - left) / 2;
      const roofY = apex + (eave - apex) * (Math.abs(x - center) / half);
      lines.push([x, base, x, roofY]);
    }

    lines.push([left, (base + eave) / 2 + 6, right, (base + eave) / 2 + 6]);
    lines.push([(left + center) / 2, (eave + apex) / 2, (right + center) / 2, (eave + apex) / 2]);

    const visible = Math.ceil(lines.length * progress);

    lines.slice(0, visible).forEach(([x1, y1, x2, y2], index) => {
      const isOutline = index < 5;

      CONTEXT.save();
      CONTEXT.globalAlpha = isOutline ? 1 : 0.7;
      crayonLine(x1, y1, x2, y2, isOutline ? 2.6 : 1.2, FRAME_COLOR, random);
      CONTEXT.restore();
    });
  };

  const traceHouse = (house) => {
    CONTEXT.beginPath();
    CONTEXT.moveTo(house.left, house.base);
    CONTEXT.lineTo(house.left, house.eave);
    CONTEXT.lineTo(house.center, house.apex);
    CONTEXT.lineTo(house.right, house.eave);
    CONTEXT.lineTo(house.right, house.base);
    CONTEXT.closePath();
  };

  const drawAisle = (house, progress) => {
    const top = house.height * 0.56;

    CONTEXT.save();
    CONTEXT.globalAlpha = 0.9 * progress;
    CONTEXT.fillStyle = '#ffffff';
    CONTEXT.beginPath();
    CONTEXT.moveTo(house.center - aisleHalfWidth(house, top), top);
    CONTEXT.lineTo(house.center + aisleHalfWidth(house, top), top);
    CONTEXT.lineTo(house.center + aisleHalfWidth(house, house.base), house.base);
    CONTEXT.lineTo(house.center - aisleHalfWidth(house, house.base), house.base);
    CONTEXT.closePath();
    CONTEXT.fill();
    CONTEXT.restore();

    // Faint crayon edges so the white runner shows on white paper.
    const random = createRandom(SEED + 23);
    const edge = 'rgba(140, 150, 148, 0.7)';

    CONTEXT.save();
    CONTEXT.globalAlpha = progress;
    crayonLine(house.center - aisleHalfWidth(house, top), top, house.center - aisleHalfWidth(house, house.base), house.base, 1, edge, random);
    crayonLine(house.center + aisleHalfWidth(house, top), top, house.center + aisleHalfWidth(house, house.base), house.base, 1, edge, random);
    CONTEXT.restore();
  };

  // Crayon grain inside the current path.
  const addGrain = (radius, random) => {
    CONTEXT.save();
    CONTEXT.clip();
    CONTEXT.globalAlpha = 0.26;
    CONTEXT.fillStyle = '#ffffff';

    const specks = Math.round(radius * 4);

    for (let index = 0; index < specks; index += 1) {
      CONTEXT.fillRect((random() - 0.5) * radius * 2.2, (random() - 0.5) * radius * 2.2, 0.6 + random() * 1.3, 0.6 + random() * 0.8);
    }

    CONTEXT.restore();
  };

  // One pointed leaf from (0,0) toward +y, with a little wobble and a pale midrib.
  const traceLeaf = (length, width, random) => {
    const wobble = width * 0.18;

    CONTEXT.beginPath();
    CONTEXT.moveTo(0, 0);
    CONTEXT.bezierCurveTo(width + (random() - 0.5) * wobble, length * 0.3, width * 0.7, length * 0.75, (random() - 0.5) * wobble, length);
    CONTEXT.bezierCurveTo(-width * 0.7, length * 0.75, -width + (random() - 0.5) * wobble, length * 0.3, 0, 0);
    CONTEXT.closePath();
  };

  const drawLeaf = (item, random) => {
    traceLeaf(item.size, item.size * item.slim, random);
    CONTEXT.fillStyle = item.color;
    CONTEXT.fill();
    addGrain(item.size * 0.6, random);
    CONTEXT.globalAlpha = 0.35;
    CONTEXT.strokeStyle = '#ffffff';
    CONTEXT.lineWidth = Math.max(0.6, item.size * 0.03);
    CONTEXT.beginPath();
    CONTEXT.moveTo(0, item.size * 0.08);
    CONTEXT.lineTo(0, item.size * 0.85);
    CONTEXT.stroke();
    CONTEXT.globalAlpha = 1;
  };

  // A palm: a short trunk and a fan of narrow fronds.
  const drawPalm = (item, random) => {
    const fronds = 7 + Math.floor(random() * 3);
    const trunk = item.size * 0.9;

    crayonLine(0, trunk, 0, 0, Math.max(1.4, item.size * 0.07), '#6d5a43', random);

    for (let index = 0; index < fronds; index += 1) {
      // Leaves are traced toward +y (down), so rotate by half a turn to point up, then fan out.
      const spread = (index / (fronds - 1) - 0.5) * 2.9 + (random() - 0.5) * 0.2;
      CONTEXT.save();
      CONTEXT.rotate(Math.PI + spread);
      traceLeaf(item.size * (0.75 + random() * 0.35), item.size * 0.11, random);
      CONTEXT.fillStyle = pick(GREENS, random);
      CONTEXT.fill();
      addGrain(item.size * 0.4, random);
      CONTEXT.restore();
    }
  };

  // A five-petal bloom; pale ivory ones get a soft grey edge so they show on white.
  const drawBloom = (item, random) => {
    const petal = item.size * 0.42;

    for (let index = 0; index < 5; index += 1) {
      const angle = (index / 5) * Math.PI * 2 + random() * 0.3;
      CONTEXT.beginPath();
      CONTEXT.ellipse(Math.cos(angle) * petal, Math.sin(angle) * petal, petal * 0.78, petal * 0.62, angle, 0, Math.PI * 2);
      CONTEXT.fillStyle = item.color;
      CONTEXT.fill();

      if (item.color === '#f3efe4') {
        CONTEXT.globalAlpha = 0.5;
        CONTEXT.strokeStyle = '#b7b2a6';
        CONTEXT.lineWidth = 0.8;
        CONTEXT.stroke();
        CONTEXT.globalAlpha = 1;
      }
    }

    CONTEXT.beginPath();
    CONTEXT.arc(0, 0, petal * 0.38, 0, Math.PI * 2);
    CONTEXT.fillStyle = '#e8c65a';
    CONTEXT.fill();
  };

  const DRAWERS = { leaf: drawLeaf, palm: drawPalm, bloom: drawBloom };

  const buildPlants = (house) => {
    const random = createRandom(SEED);
    const plants = [];
    const unit = house.width;

    const place = (count, makeItem, isAllowed) => {
      for (let index = 0; index < count; index += 1) {
        for (let attempt = 0; attempt < 1500; attempt += 1) {
          const item = makeItem();
          const x = house.left + random() * (house.right - house.left);
          const y = house.apex + random() * (house.base - house.apex);

          if (!isInsideHouse(house, x, y, item.size * 0.35) || !isAllowed(x, y, item)) {
            continue;
          }

          const crowded = plants.some((other) => Math.hypot(other.x - x, other.y - y) < (other.size + item.size) * item.spacing);

          if (crowded) {
            continue;
          }

          plants.push({ ...item, x, y, seed: Math.floor(random() * 1e9) });
          break;
        }
      }
    };

    const offAisle = (x, y, item) => !isOnAisle(house, x, y, item.size * 0.6);
    const ground = house.height * 0.6;
    // Leaves stand mostly upright with a lean, like potted plants seen from the front.
    const leafAngle = () => Math.PI + (random() - 0.5) * 2.2;

    // Tall palms: crowns under the glass roof, trunks down to the pots.
    place(8, () => ({ kind: 'palm', size: unit * (0.12 + random() * 0.05), angle: (random() - 0.5) * 0.25, spacing: 0.7 }), (x, y, item) => offAisle(x, y, item) && y > house.height * 0.24 && y < house.height * 0.66);
    // Flowers hug the aisle edges, like the arrangements in the venue. Placed before the bushes so they get the spots.
    place(46, () => ({ kind: 'bloom', size: unit * (0.022 + random() * 0.02), angle: random() * Math.PI, color: pick(BLOOMS, random), spacing: 0.62 }), (x, y, item) => y > house.height * 0.58 && !isOnAisle(house, x, y, item.size * 0.25) && isOnAisle(house, x, y, unit * 0.085));
    // Bushes along the ground on both sides of the aisle.
    place(60, () => ({ kind: 'leaf', size: unit * (0.05 + random() * 0.05), slim: 0.3 + random() * 0.2, angle: leafAngle(), color: pick(GREENS, random), spacing: 0.36 }), (x, y, item) => offAisle(x, y, item) && y > ground);
    // A few more leaves higher up between the palms, and blooms scattered among the bushes.
    place(22, () => ({ kind: 'leaf', size: unit * (0.035 + random() * 0.03), slim: 0.32 + random() * 0.2, angle: leafAngle(), color: pick(GREENS, random), spacing: 0.5 }), (x, y, item) => offAisle(x, y, item) && y > house.height * 0.38);
    place(14, () => ({ kind: 'bloom', size: unit * (0.018 + random() * 0.014), angle: random() * Math.PI, color: pick(BLOOMS, random), spacing: 0.7 }), (x, y, item) => offAisle(x, y, item) && y > ground);

    // Ground first, so the house fills upward.
    return plants.sort((a, b) => b.y - a.y);
  };

  const drawPlant = (item, progress) => {
    if (progress <= 0) {
      return;
    }

    const overshoot = progress < 1 ? Math.sin(progress * Math.PI) * 0.14 : 0;
    const scale = Math.min(progress, 1) + overshoot;
    const random = createRandom(item.seed);

    CONTEXT.save();
    CONTEXT.translate(item.x, item.y);
    CONTEXT.scale(scale, scale);
    CONTEXT.rotate(item.angle);
    DRAWERS[item.kind](item, random);
    CONTEXT.restore();
  };

  // Longest wait for the page's load event, counted from this script: a slow photo or font never holds the intro back for good.
  const INTRO_LOAD_WAIT_MS = 3000;
  // Longest wait for web fonts after the load event (they are nearly always in by then), still within the limit above.
  const INTRO_FONT_WAIT_MS = 800;
  // Fired on the greenhouse canvas the moment the intro leaves waiting, so the weather layer shows with it.
  const INTRO_START_EVENT = 'introstart';
  const introDeadline = performance.now() + INTRO_LOAD_WAIT_MS;
  // Elapsed time far past the end of the intro: renders the finished picture in one frame.
  const INTRO_FINISHED_MS = 1e6;

  let house = null;
  let plants = [];
  let startTime = 0;
  // Elapsed time the next frame should show; the clock is anchored to that frame's timestamp.
  let pendingElapsed = null;
  let frameId = 0;
  let introState = '';

  // The intro state is exposed on the canvas as data-intro: waiting -> playing -> done.
  const setIntroState = (state) => {
    if (introState === state) {
      return;
    }

    const wasWaiting = introState === 'waiting';

    introState = state;
    CANVAS.dataset.intro = state;

    if (wasWaiting) {
      CANVAS.dispatchEvent(new CustomEvent(INTRO_START_EVENT));
    }
  };

  const render = (now) => {
    if (pendingElapsed !== null) {
      startTime = now - pendingElapsed;
      pendingElapsed = null;
    }

    const elapsed = now - startTime;
    const frameProgress = Math.min(elapsed / FRAME_MS, 1);
    let isDone = frameProgress >= 1;

    CONTEXT.clearRect(0, 0, house.width, house.height);
    drawAisle(house, frameProgress);

    // Plants stay inside the glass: clip to the house outline.
    CONTEXT.save();
    traceHouse(house);
    CONTEXT.clip();

    plants.forEach((item, index) => {
      const progress = Math.max(0, Math.min((elapsed - FRAME_MS * 0.6 - index * STAGGER_MS) / POP_MS, 1));

      if (progress < 1) {
        isDone = false;
      }

      drawPlant(item, progress);
    });

    CONTEXT.restore();
    // The frame goes on top, so the plants read as seen through the glass.
    drawFrame(house, frameProgress);

    setIntroState(isDone ? 'done' : 'playing');
    frameId = isDone ? 0 : requestAnimationFrame(render);
  };

  const setUp = () => {
    const ratio = window.devicePixelRatio || 1;
    const width = CANVAS.clientWidth;
    const height = CANVAS.clientHeight;

    CANVAS.width = Math.round(width * ratio);
    CANVAS.height = Math.round(height * ratio);
    CONTEXT.setTransform(ratio, 0, 0, ratio, 0, 0);
    house = buildHouse(width, height);
    plants = buildPlants(house);
  };

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Draws from the given elapsed time on; the clock starts at the first frame actually painted, not at this call.
  const playFrom = (elapsed) => {
    cancelAnimationFrame(frameId);

    if (elapsed >= INTRO_FINISHED_MS || prefersReducedMotion) {
      pendingElapsed = INTRO_FINISHED_MS;
      render(performance.now());

      return;
    }

    pendingElapsed = elapsed;
    frameId = requestAnimationFrame(render);
  };

  const play = (shouldAnimate) => {
    setUp();
    playFrom(shouldAnimate ? 0 : INTRO_FINISHED_MS);
  };

  let resizeTimer = 0;

  // Small crayon wedding objects set between the title words, in the same hand as the greenhouse.
  const GOLD = '#c9a24d';
  const IVORY = '#f3efe4';
  const EDGE = '#a9a397';

  const fillCrayon = (color, radius, random, edgeColor) => {
    CONTEXT.fillStyle = color;
    CONTEXT.fill();
    addGrain(radius, random);

    if (edgeColor) {
      CONTEXT.globalAlpha = 0.8;
      CONTEXT.strokeStyle = edgeColor;
      CONTEXT.lineWidth = 1;
      CONTEXT.stroke();
      CONTEXT.globalAlpha = 1;
    }
  };

  // Two interlocking gold rings with a small stone on the front one.
  const drawRings = (width, height, random) => {
    const radius = height * 0.27;
    const y = height * 0.6;

    CONTEXT.lineWidth = Math.max(2, height * 0.09);
    CONTEXT.strokeStyle = GOLD;
    [width * 0.38, width * 0.62].forEach((x) => {
      CONTEXT.beginPath();
      CONTEXT.ellipse(x + (random() - 0.5), y + (random() - 0.5), radius, radius * 0.92, 0, 0, Math.PI * 2);
      CONTEXT.stroke();
    });
    CONTEXT.save();
    CONTEXT.translate(width * 0.38, y - radius - height * 0.06);
    CONTEXT.beginPath();
    CONTEXT.moveTo(0, -height * 0.11);
    CONTEXT.lineTo(height * 0.09, 0);
    CONTEXT.lineTo(0, height * 0.08);
    CONTEXT.lineTo(-height * 0.09, 0);
    CONTEXT.closePath();
    fillCrayon('#cfe3ee', height * 0.1, random, '#8fb2c4');
    CONTEXT.restore();
  };

  // A bouquet: blooms and leaves on top, stems gathered in an ivory paper wrap.
  const drawBouquet = (width, height, seed) => {
    const random = createRandom(seed);
    const cx = width / 2;

    CONTEXT.strokeStyle = '#5d7d4f';
    CONTEXT.lineWidth = 1.2;
    [-0.16, 0, 0.16].forEach((spread) => {
      CONTEXT.beginPath();
      CONTEXT.moveTo(cx + width * spread, height * 0.4);
      CONTEXT.lineTo(cx + width * spread * 0.2, height * 0.95);
      CONTEXT.stroke();
    });
    drawPlant({ kind: 'leaf', x: cx - width * 0.12, y: height * 0.42, size: height * 0.34, slim: 0.42, angle: 2.4, color: GREENS[0], seed: seed + 1 }, 1);
    drawPlant({ kind: 'leaf', x: cx + width * 0.12, y: height * 0.42, size: height * 0.34, slim: 0.42, angle: -2.4, color: GREENS[2], seed: seed + 2 }, 1);
    drawPlant({ kind: 'bloom', x: cx - width * 0.15, y: height * 0.3, size: height * 0.3, angle: 0, color: BLOOMS[0], seed: seed + 3 }, 1);
    drawPlant({ kind: 'bloom', x: cx + width * 0.14, y: height * 0.28, size: height * 0.28, angle: 0, color: IVORY, seed: seed + 4 }, 1);
    drawPlant({ kind: 'bloom', x: cx, y: height * 0.16, size: height * 0.3, angle: 0, color: BLOOMS[1], seed: seed + 5 }, 1);
    CONTEXT.beginPath();
    CONTEXT.moveTo(cx - width * 0.2, height * 0.5);
    CONTEXT.lineTo(cx + width * 0.2, height * 0.5);
    CONTEXT.lineTo(cx + width * 0.05, height * 0.98);
    CONTEXT.lineTo(cx - width * 0.05, height * 0.98);
    CONTEXT.closePath();
    fillCrayon(IVORY, height * 0.3, random, EDGE);
  };

  // A three-tier cake with a small bloom on top.
  const drawCake = (width, height, seed) => {
    const random = createRandom(seed);
    const cx = width / 2;
    const tiers = [
      [0.64, 0.7, 0.98],
      [0.46, 0.45, 0.7],
      [0.3, 0.24, 0.45],
    ];

    tiers.forEach(([tierWidth, top, bottom]) => {
      const half = (width * tierWidth) / 2;
      CONTEXT.beginPath();
      CONTEXT.moveTo(cx - half, height * bottom);
      CONTEXT.lineTo(cx - half + (random() - 0.5), height * top);
      CONTEXT.lineTo(cx + half + (random() - 0.5), height * top);
      CONTEXT.lineTo(cx + half, height * bottom);
      CONTEXT.closePath();
      fillCrayon(IVORY, half, random, EDGE);
      CONTEXT.globalAlpha = 0.6;
      CONTEXT.strokeStyle = BLOOMS[0];
      CONTEXT.lineWidth = 1.2;
      CONTEXT.beginPath();
      CONTEXT.moveTo(cx - half + 1, height * (top + 0.05));
      CONTEXT.lineTo(cx + half - 1, height * (top + 0.05));
      CONTEXT.stroke();
      CONTEXT.globalAlpha = 1;
    });
    drawPlant({ kind: 'bloom', x: cx, y: height * 0.14, size: height * 0.22, angle: 0, color: BLOOMS[0], seed: seed + 7 }, 1);
  };

  // Two champagne flutes touching in a toast.
  const drawToast = (width, height, seed) => {
    const random = createRandom(seed);

    [[width * 0.36, -0.28], [width * 0.64, 0.28]].forEach(([x, tilt]) => {
      CONTEXT.save();
      CONTEXT.translate(x, height * 0.96);
      CONTEXT.rotate(tilt);
      CONTEXT.beginPath();
      CONTEXT.moveTo(-height * 0.1, -height * 0.5);
      CONTEXT.lineTo(height * 0.1, -height * 0.5);
      CONTEXT.lineTo(height * 0.08, -height * 0.86);
      CONTEXT.lineTo(-height * 0.08, -height * 0.86);
      CONTEXT.closePath();
      fillCrayon('#f1dc9a', height * 0.2, random, null);
      CONTEXT.strokeStyle = EDGE;
      CONTEXT.lineWidth = 1.1;
      CONTEXT.beginPath();
      CONTEXT.moveTo(-height * 0.12, -height * 0.92);
      CONTEXT.lineTo(-height * 0.1, -height * 0.46);
      CONTEXT.quadraticCurveTo(0, -height * 0.38, height * 0.1, -height * 0.46);
      CONTEXT.lineTo(height * 0.12, -height * 0.92);
      CONTEXT.moveTo(0, -height * 0.42);
      CONTEXT.lineTo(0, -height * 0.04);
      CONTEXT.moveTo(-height * 0.1, 0);
      CONTEXT.lineTo(height * 0.1, 0);
      CONTEXT.stroke();
      CONTEXT.restore();
    });

    // A few sparkles where the glasses meet.
    CONTEXT.fillStyle = GOLD;
    [[0.5, 0.06], [0.42, 0.14], [0.6, 0.12]].forEach(([px, py]) => {
      CONTEXT.beginPath();
      CONTEXT.arc(width * px, height * py, Math.max(1, height * 0.03), 0, Math.PI * 2);
      CONTEXT.fill();
    });
  };

  const drawGlyph = (kind, width, height, seed) => {
    if (kind === 'rings') {
      drawRings(width, height, createRandom(seed));

      return;
    }

    if (kind === 'bouquet') {
      drawBouquet(width, height, seed);

      return;
    }

    if (kind === 'cake') {
      drawCake(width, height, seed);

      return;
    }

    drawToast(width, height, seed);
  };

  const drawGlyphs = () => {
    const ratio = window.devicePixelRatio || 1;

    document.querySelectorAll('.glyph').forEach((glyph, index) => {
      const width = glyph.clientWidth;
      const height = glyph.clientHeight;

      glyph.width = Math.round(width * ratio);
      glyph.height = Math.round(height * ratio);
      CONTEXT = glyph.getContext('2d');
      CONTEXT.setTransform(ratio, 0, 0, ratio, 0, 0);
      drawGlyph(glyph.dataset.glyph, width, height, SEED + 101 + index * 17);
    });

    CONTEXT = MAIN_CONTEXT;
  };

  // Re-lays the greenhouse for a new canvas size without losing the intro's place.
  const resizeIntro = () => {
    if (introState === 'waiting') {
      setUp();

      return;
    }

    if (introState === 'playing') {
      const elapsed = pendingElapsed !== null ? pendingElapsed : performance.now() - startTime;

      setUp();
      playFrom(elapsed);

      return;
    }

    play(false);
  };

  const handleResize = () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      drawGlyphs();

      // Mobile address bars fire resize without changing the canvas; only a real size change re-lays the picture.
      const isSameSize = house && CANVAS.clientWidth === house.width && CANVAS.clientHeight === house.height;

      if (isSameSize) {
        return;
      }

      resizeIntro();
    }, 150);
  };

  const handleReplay = () => {
    play(true);
  };

  // Each wait below ends on its own: an event that always fires, a time limit, or an immediate fallback.
  const waitForVisiblePage = (callback) => {
    if (document.visibilityState !== 'hidden') {
      callback();

      return;
    }

    const handleIntroVisibility = () => {
      if (document.visibilityState === 'hidden') {
        return;
      }

      document.removeEventListener('visibilitychange', handleIntroVisibility);
      callback();
    };

    document.addEventListener('visibilitychange', handleIntroVisibility);
  };

  const getIntroTimeLeft = () => {
    return Math.max(0, introDeadline - performance.now());
  };

  // Photos, fonts and scripts are all in once the window has loaded; the deadline caps the wait.
  const waitForLoadedPage = (callback) => {
    let isFinished = false;

    const finish = () => {
      if (isFinished) {
        return;
      }

      isFinished = true;
      clearTimeout(loadTimer);
      window.removeEventListener('load', finish);
      callback();
    };
    const loadTimer = setTimeout(finish, getIntroTimeLeft());

    if (document.readyState === 'complete') {
      finish();

      return;
    }

    window.addEventListener('load', finish);
  };

  const waitForFonts = (callback) => {
    let isFinished = false;

    const finish = () => {
      if (isFinished) {
        return;
      }

      isFinished = true;
      clearTimeout(fontTimer);
      callback();
    };
    const fontTimer = setTimeout(finish, Math.min(INTRO_FONT_WAIT_MS, getIntroTimeLeft()));

    if (!document.fonts || !document.fonts.ready) {
      finish();

      return;
    }

    document.fonts.ready.then(finish, finish);
  };

  // Starts only while the cover is on screen, e.g. not when a reload restored a scrolled-down position.
  const waitForCoverOnScreen = (callback) => {
    if (!('IntersectionObserver' in window)) {
      callback();

      return;
    }

    try {
      new IntersectionObserver((entries, observer) => {
        if (!entries.some((entry) => entry.isIntersecting)) {
          return;
        }

        observer.disconnect();
        callback();
      }).observe(CANVAS);
    } catch {
      callback();
    }
  };

  const startIntro = () => {
    // A replay tap may have started it already.
    if (introState !== 'waiting') {
      return;
    }

    try {
      play(true);
    } catch (error) {
      setIntroState('done');
      console.error(error);
    }
  };

  drawGlyphs();
  setUp();
  setIntroState('waiting');
  window.addEventListener('resize', handleResize);
  CANVAS.addEventListener('click', handleReplay);

  // Reduced motion: the finished picture, as soon as the page has loaded.
  const showFinishedPicture = () => {
    if (introState !== 'waiting') {
      return;
    }

    play(false);
  };

  if (prefersReducedMotion) {
    waitForLoadedPage(showFinishedPicture);
  } else {
    waitForVisiblePage(() => {
      waitForLoadedPage(() => {
        waitForFonts(() => {
          waitForCoverOnScreen(startIntro);
        });
      });
    });
  }
</script>

<script>
  // Live weather at the venue, drawn in the same crayon hand over the cover.
  // Source: Open-Meteo (free, no key). Preview any weather with #clear, #cloudy, #rain, #snow, #fog, #storm or #night.
  const VENUE_LATITUDE = 37.5665;
  const VENUE_LONGITUDE = 126.978;
  const WEATHER_URL = `https://api.open-meteo.com/v1/forecast?latitude=${VENUE_LATITUDE}&longitude=${VENUE_LONGITUDE}&current=weather_code,is_day&timezone=Asia%2FSeoul`;
  const WEATHER_KINDS = ['clear', 'cloudy', 'rain', 'snow', 'fog', 'storm', 'night'];
  const WEATHER_REFRESH_MS = 30 * 60 * 1000;

  // Nothing is drawn until the greenhouse intro starts (data-weather: waiting -> on); after this long it turns on by itself,
  // so the weather still shows when the intro script is missing or failed.
  const WEATHER_START_WAIT_MS = 3000;
  const WEATHER_INTRO_EVENT = 'introstart';

  const weatherCanvas = document.getElementById('weather');
  const weatherContext = weatherCanvas.getContext('2d');
  const weatherReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let weatherState = '';
  let weatherStartTimer = 0;
  let weatherKind = 'clear';
  let weatherParticles = [];
  let weatherFrame = 0;
  let weatherVisible = true;
  let weatherFlash = 0;
  let weatherWidth = 0;
  let weatherHeight = 0;
  let weatherLastTime = null;
  let weatherMeteor = null;
  let weatherMeteorWait = 0;

  // All motion is in pixels (or radians) per second, scaled by the time since the last frame.
  // A long gap (tab in the background, cover off screen) counts as one short step, so nothing jumps.
  const WEATHER_MAX_STEP_S = 0.05;
  const WEATHER_RAIN_SPEED = [330, 480];
  const WEATHER_RAIN_DRIFT = -72;
  const WEATHER_RAIN_SLANT = -2.6;
  const WEATHER_SNOW_SPEED = [24, 54];
  const WEATHER_SNOW_SWAY_RATE = 1.2;
  const WEATHER_SNOW_SWAY_PX = 6;
  const WEATHER_CLOUD_SPEED = [18, 30];
  const WEATHER_CLOUD_BOB_RATE = 0.9;
  const WEATHER_CLOUD_BOB_PX = 3;
  const WEATHER_FOG_SPEED = [14, 24];
  const WEATHER_FOG_BREATH_RATE = 0.8;
  const WEATHER_FOG_DENSITY = [0.5, 0.85];
  const WEATHER_MOTE_SPEED = [20, 36];
  const WEATHER_MOTE_SWAY_RATE = 1.3;
  const WEATHER_MOTE_SWAY_PX = 9;
  const WEATHER_MOTE_TWINKLE_RATE = 1.6;
  const WEATHER_STAR_SPEED = [6, 10];
  const WEATHER_STAR_TWINKLE_RATE = [1.1, 1.9];
  const WEATHER_METEOR_GAP_S = [4, 8];
  const WEATHER_METEOR_LIFE_S = 0.7;
  const WEATHER_METEOR_SPEED = 380;
  const WEATHER_METEOR_TAIL_PX = 34;
  // Storm: about one flash every four seconds on average, each fading out in under a third of a second.
  const WEATHER_FLASH_RATE = 0.24;
  const WEATHER_FLASH_FADE = 3.6;

  // WMO weather codes to the scenes the cover can draw.
  const kindFromCode = (code, isDay) => {
    if (code >= 95) {
      return 'storm';
    }

    if ((code >= 71 && code <= 77) || code === 85 || code === 86) {
      return 'snow';
    }

    if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) {
      return 'rain';
    }

    if (code === 45 || code === 48) {
      return 'fog';
    }

    if (code >= 2) {
      return 'cloudy';
    }

    return isDay ? 'clear' : 'night';
  };

  const kindFromHash = () => {
    const name = location.hash.replace('#', '');

    return WEATHER_KINDS.includes(name) ? name : null;
  };

  const random = (min, max) => {
    return min + Math.random() * (max - min);
  };

  const makeParticle = (kind, isFresh) => {
    const y = isFresh ? random(-weatherHeight * 0.1, 0) : random(0, weatherHeight);

    if (kind === 'rain' || kind === 'storm') {
      return { x: random(-20, weatherWidth + 20), y, length: random(10, 18), speed: random(...WEATHER_RAIN_SPEED) };
    }

    if (kind === 'snow') {
      return { x: random(0, weatherWidth), y, radius: random(1.6, 3.6), speed: random(...WEATHER_SNOW_SPEED), sway: random(0, Math.PI * 2) };
    }

    if (kind === 'cloudy' || kind === 'fog') {
      const band = kind === 'fog';

      return {
        x: random(-weatherWidth * 0.4, weatherWidth),
        y: band ? random(weatherHeight * 0.35, weatherHeight * 0.85) : random(weatherHeight * 0.3, weatherHeight * 0.5),
        size: band ? random(90, 150) : random(34, 56),
        speed: band ? random(...WEATHER_FOG_SPEED) : random(...WEATHER_CLOUD_SPEED),
        phase: random(0, Math.PI * 2),
      };
    }

    if (kind === 'night') {
      // Smaller stars drift a little slower, so the sky reads as having some depth.
      const radius = random(0.8, 1.9);
      const depth = (radius - 0.8) / 1.1;

      return {
        x: random(0, weatherWidth),
        y: random(weatherHeight * 0.26, weatherHeight * 0.5),
        radius,
        speed: WEATHER_STAR_SPEED[0] + depth * (WEATHER_STAR_SPEED[1] - WEATHER_STAR_SPEED[0]),
        twinkle: random(...WEATHER_STAR_TWINKLE_RATE),
        phase: random(0, Math.PI * 2),
      };
    }

    // Clear day: warm light motes drifting up through the glass.
    return {
      x: random(0, weatherWidth),
      y: isFresh ? weatherHeight * 0.9 : random(weatherHeight * 0.3, weatherHeight * 0.9),
      radius: random(1.2, 2.6),
      speed: random(...WEATHER_MOTE_SPEED),
      sway: random(0, Math.PI * 2),
      phase: random(0, Math.PI * 2),
    };
  };

  // Night: a thin, short shooting star now and then, sliding down and to the left across the upper sky.
  const makeWeatherMeteor = () => {
    const angle = random(Math.PI * 0.8, Math.PI * 0.87);

    return {
      x: random(weatherWidth * 0.45, weatherWidth * 0.95),
      y: random(weatherHeight * 0.25, weatherHeight * 0.34),
      dx: Math.cos(angle),
      dy: Math.sin(angle),
      age: 0,
    };
  };

  const drawWeatherMeteor = (meteor) => {
    const fade = Math.sin(Math.PI * Math.min(meteor.age / WEATHER_METEOR_LIFE_S, 1));
    const tailX = meteor.x - meteor.dx * WEATHER_METEOR_TAIL_PX;
    const tailY = meteor.y - meteor.dy * WEATHER_METEOR_TAIL_PX;
    const gradient = weatherContext.createLinearGradient(tailX, tailY, meteor.x, meteor.y);

    gradient.addColorStop(0, 'rgba(214, 178, 90, 0)');
    gradient.addColorStop(1, `rgba(214, 178, 90, ${0.9 * fade})`);
    weatherContext.strokeStyle = gradient;
    weatherContext.lineWidth = 1.2;
    weatherContext.lineCap = 'round';
    weatherContext.beginPath();
    weatherContext.moveTo(tailX, tailY);
    weatherContext.lineTo(meteor.x, meteor.y);
    weatherContext.stroke();
  };

  const stepWeatherMeteor = (dt) => {
    if (!weatherMeteor) {
      weatherMeteorWait -= dt;

      if (weatherMeteorWait <= 0 && dt > 0) {
        weatherMeteor = makeWeatherMeteor();
      }

      return;
    }

    weatherMeteor.age += dt;
    weatherMeteor.x += weatherMeteor.dx * WEATHER_METEOR_SPEED * dt;
    weatherMeteor.y += weatherMeteor.dy * WEATHER_METEOR_SPEED * dt;

    if (weatherMeteor.age >= WEATHER_METEOR_LIFE_S) {
      weatherMeteor = null;
      weatherMeteorWait = random(...WEATHER_METEOR_GAP_S);

      return;
    }

    drawWeatherMeteor(weatherMeteor);
  };

  const PARTICLE_COUNTS = { clear: 26, cloudy: 4, rain: 70, storm: 90, snow: 55, fog: 5, night: 30 };

  const resetParticles = () => {
    weatherParticles = Array.from({ length: PARTICLE_COUNTS[weatherKind] }, () => makeParticle(weatherKind, false));
    weatherMeteor = null;
    weatherMeteorWait = random(WEATHER_METEOR_GAP_S[0] * 0.5, WEATHER_METEOR_GAP_S[1] * 0.5);
    weatherFlash = 0;
  };

  // A plain cloud shape with no outline.
  const drawCloud = (x, y, size, alpha) => {
    weatherContext.save();
    weatherContext.globalAlpha = alpha;
    weatherContext.fillStyle = '#e9ebec';
    weatherContext.beginPath();
    weatherContext.arc(x, y, size * 0.42, Math.PI * 0.5, Math.PI * 1.5);
    weatherContext.arc(x + size * 0.45, y - size * 0.32, size * 0.5, Math.PI * 1.05, Math.PI * 1.95);
    weatherContext.arc(x + size * 1.0, y - size * 0.1, size * 0.4, Math.PI * 1.3, Math.PI * 0.5);
    weatherContext.closePath();
    weatherContext.fill();
    weatherContext.restore();
  };

  // Draws one frame, moving everything by dt seconds (0 draws the scene where it stands).
  const stepWeather = (dt) => {
    weatherContext.clearRect(0, 0, weatherWidth, weatherHeight);

    weatherParticles.forEach((particle, index) => {
      if (weatherKind === 'rain' || weatherKind === 'storm') {
        particle.y += particle.speed * dt;
        particle.x += WEATHER_RAIN_DRIFT * dt;
        weatherContext.strokeStyle = 'rgba(96, 128, 150, 0.55)';
        weatherContext.lineWidth = 1.3;
        weatherContext.lineCap = 'round';
        weatherContext.beginPath();
        weatherContext.moveTo(particle.x, particle.y);
        weatherContext.lineTo(particle.x + WEATHER_RAIN_SLANT, particle.y + particle.length);
        weatherContext.stroke();
      } else if (weatherKind === 'snow') {
        particle.y += particle.speed * dt;
        particle.sway += WEATHER_SNOW_SWAY_RATE * dt;
        const x = particle.x + Math.sin(particle.sway) * WEATHER_SNOW_SWAY_PX;
        weatherContext.fillStyle = '#ffffff';
        weatherContext.strokeStyle = 'rgba(150, 160, 165, 0.7)';
        weatherContext.lineWidth = 0.8;
        weatherContext.beginPath();
        weatherContext.arc(x, particle.y, particle.radius, 0, Math.PI * 2);
        weatherContext.fill();
        weatherContext.stroke();
      } else if (weatherKind === 'cloudy') {
        particle.x += particle.speed * dt;
        particle.phase += WEATHER_CLOUD_BOB_RATE * dt;
        drawCloud(particle.x, particle.y + Math.sin(particle.phase) * WEATHER_CLOUD_BOB_PX, particle.size, 0.85);
      } else if (weatherKind === 'fog') {
        particle.x += particle.speed * dt;
        particle.phase += WEATHER_FOG_BREATH_RATE * dt;
        // Each band thickens and thins slowly, out of step with the others.
        const density = WEATHER_FOG_DENSITY[0] + (WEATHER_FOG_DENSITY[1] - WEATHER_FOG_DENSITY[0]) * (0.5 + 0.5 * Math.sin(particle.phase));
        const gradient = weatherContext.createLinearGradient(particle.x, 0, particle.x + particle.size * 2.4, 0);
        gradient.addColorStop(0, 'rgba(236, 238, 238, 0)');
        gradient.addColorStop(0.5, `rgba(236, 238, 238, ${density})`);
        gradient.addColorStop(1, 'rgba(236, 238, 238, 0)');
        weatherContext.fillStyle = gradient;
        weatherContext.fillRect(particle.x, particle.y, particle.size * 2.4, particle.size * 0.32);
      } else if (weatherKind === 'night') {
        particle.x += particle.speed * dt;
        particle.phase += particle.twinkle * dt;

        // Stars that slide off the right edge come back in on the left.
        if (particle.x > weatherWidth + 4) {
          particle.x -= weatherWidth + 8;
        }

        const shine = 0.5 + 0.5 * Math.sin(particle.phase);
        weatherContext.fillStyle = `rgba(214, 178, 90, ${0.25 + 0.75 * shine})`;
        weatherContext.beginPath();
        weatherContext.arc(particle.x, particle.y, particle.radius * (0.65 + 0.6 * shine), 0, Math.PI * 2);
        weatherContext.fill();
      } else {
        particle.y -= particle.speed * dt;
        particle.sway += WEATHER_MOTE_SWAY_RATE * dt;
        particle.phase += WEATHER_MOTE_TWINKLE_RATE * dt;
        const shine = Math.abs(Math.sin(particle.phase));
        weatherContext.fillStyle = `rgba(232, 190, 80, ${0.3 + 0.5 * shine})`;
        weatherContext.beginPath();
        weatherContext.arc(particle.x + Math.sin(particle.sway) * WEATHER_MOTE_SWAY_PX, particle.y, particle.radius * (0.8 + 0.35 * shine), 0, Math.PI * 2);
        weatherContext.fill();
      }

      // Recycle particles that left the scene; clouds and fog bands come back as soon as they clear the right edge.
      const isDrifting = weatherKind === 'cloudy' || weatherKind === 'fog';
      const isGone = particle.y > weatherHeight + 20 || (isDrifting && particle.x - particle.size * 0.5 > weatherWidth) || (weatherKind === 'clear' && particle.y < weatherHeight * 0.25);

      if (isGone) {
        weatherParticles[index] = makeParticle(weatherKind, true);

        if (isDrifting) {
          weatherParticles[index].x = -weatherParticles[index].size * 2.4;
        }
      }
    });

    if (weatherKind === 'night') {
      stepWeatherMeteor(dt);
    }

    // Storm: a soft, rare flash of light.
    if (weatherKind === 'storm') {
      if (weatherFlash <= 0 && Math.random() < 1 - Math.exp(-WEATHER_FLASH_RATE * dt)) {
        weatherFlash = 1;
      }

      if (weatherFlash > 0) {
        weatherContext.fillStyle = `rgba(255, 255, 245, ${weatherFlash * 0.45})`;
        weatherContext.fillRect(0, 0, weatherWidth, weatherHeight);
        weatherFlash -= WEATHER_FLASH_FADE * dt;
      }
    }
  };

  const loopWeather = (time) => {
    const dt = weatherLastTime === null ? 0 : Math.min(Math.max(time - weatherLastTime, 0) / 1000, WEATHER_MAX_STEP_S);

    weatherLastTime = time;
    stepWeather(dt);
    weatherFrame = weatherVisible && !weatherReducedMotion ? requestAnimationFrame(loopWeather) : 0;

    if (!weatherFrame) {
      weatherLastTime = null;
    }
  };

  const startWeather = (kind) => {
    weatherKind = kind;
    cancelAnimationFrame(weatherFrame);
    weatherFrame = 0;
    weatherLastTime = null;
    resetParticles();

    // While waiting, only the scene is chosen; it is drawn once the weather turns on.
    if (weatherState !== 'on') {
      return;
    }

    if (weatherReducedMotion) {
      stepWeather(0);

      return;
    }

    weatherFrame = requestAnimationFrame(loopWeather);
  };

  const sizeWeather = () => {
    const ratio = window.devicePixelRatio || 1;

    weatherWidth = weatherCanvas.clientWidth;
    weatherHeight = weatherCanvas.clientHeight;
    weatherCanvas.width = Math.round(weatherWidth * ratio);
    weatherCanvas.height = Math.round(weatherHeight * ratio);
    weatherContext.setTransform(ratio, 0, 0, ratio, 0, 0);
  };

  const fetchWeather = async () => {
    try {
      const response = await fetch(WEATHER_URL);

      if (!response.ok) {
        return null;
      }

      const data = await response.json();

      return kindFromCode(data.current.weather_code, data.current.is_day === 1);
    } catch {
      // Offline, blocked or failed: keep the current scene.
      return null;
    }
  };

  const refreshWeather = async () => {
    const forced = kindFromHash();

    if (forced) {
      startWeather(forced);

      return;
    }

    const live = await fetchWeather();

    if (live && !kindFromHash()) {
      startWeather(live);
    }
  };

  const handleWeatherHash = () => {
    refreshWeather();
  };

  // The mobile address bar folding away changes only the height: keep the scene going and
  // move every particle in proportion to the new size instead of scattering a fresh set.
  const handleWeatherResize = () => {
    const width = weatherCanvas.clientWidth;
    const height = weatherCanvas.clientHeight;

    if (width === weatherWidth && height === weatherHeight) {
      return;
    }

    const scaleX = weatherWidth > 0 ? width / weatherWidth : 1;
    const scaleY = weatherHeight > 0 ? height / weatherHeight : 1;
    const wasEmpty = weatherWidth === 0 || weatherHeight === 0;

    sizeWeather();

    if (wasEmpty) {
      resetParticles();
    } else {
      weatherParticles.forEach((particle) => {
        particle.x *= scaleX;
        particle.y *= scaleY;
      });

      if (weatherMeteor) {
        weatherMeteor.x *= scaleX;
        weatherMeteor.y *= scaleY;
      }
    }

    // Resizing clears the canvas; the still picture has no next frame to repaint it.
    if (weatherState === 'on' && !weatherFrame) {
      stepWeather(0);
    }
  };

  const setWeatherState = (state) => {
    weatherState = state;
    weatherCanvas.dataset.weather = state;
  };

  // The canvas fades in through CSS (opacity on data-weather="on") while the scene starts moving.
  const showWeather = () => {
    if (weatherState === 'on') {
      return;
    }

    clearTimeout(weatherStartTimer);
    setWeatherState('on');
    startWeather(weatherKind);
  };

  const handleWeatherIntroStart = () => {
    showWeather();
  };

  const waitForGreenhouseIntro = () => {
    const greenhouse = document.getElementById('greenhouse');
    const greenhouseState = greenhouse ? greenhouse.dataset.intro : '';

    if (greenhouseState === 'playing' || greenhouseState === 'done') {
      showWeather();

      return;
    }

    weatherStartTimer = setTimeout(showWeather, WEATHER_START_WAIT_MS);

    if (greenhouse) {
      greenhouse.addEventListener(WEATHER_INTRO_EVENT, handleWeatherIntroStart, { once: true });
    }
  };

  setWeatherState('waiting');
  sizeWeather();
  startWeather(kindFromHash() ?? 'clear');
  waitForGreenhouseIntro();
  refreshWeather();
  setInterval(refreshWeather, WEATHER_REFRESH_MS);
  window.addEventListener('hashchange', handleWeatherHash);
  window.addEventListener('resize', handleWeatherResize);

  // Pause the animation while the cover is scrolled out of view.
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(([entry]) => {
      weatherVisible = entry.isIntersecting;

      if (weatherState === 'on' && weatherVisible && !weatherFrame && !weatherReducedMotion) {
        weatherFrame = requestAnimationFrame(loopWeather);
      }
    }).observe(weatherCanvas);
  }
</script>
