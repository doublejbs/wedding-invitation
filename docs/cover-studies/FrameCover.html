<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>진용·하림 액자 커버</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Layout: one phone screen; title, names, a framed photo hanging on a white wall, then date and place.
     Single look on purpose (a gallery wall in daylight), so no dark theme. */
  :root {
    color-scheme: light;
    --wall: #eeeff0;
    --wall-shade: #e3e5e6;
    --frame: #141414;
    --mat: #fbfaf7;
    --ink: #1f1e1c;
    --soft: #6c6963;
    --hand: 'Nanum Pen Script', 'Apple SD Gothic Neo', cursive;
    --serif: 'Gowun Batang', 'AppleMyungjo', serif;
  }

  html,
  body {
    height: 100%;
  }

  body {
    background: var(--wall);
    color: var(--ink);
    font-family: var(--serif);
  }

  .cover {
    min-height: 100%;
    box-sizing: border-box;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 56px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    /* Daylight from the upper left falling across the wall. */
    background:
      radial-gradient(120% 70% at 18% 8%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0) 60%),
      linear-gradient(180deg, var(--wall) 0%, var(--wall-shade) 100%);
  }

  .title {
    margin: 0;
    font-family: var(--hand);
    font-weight: 400;
    font-size: clamp(46px, 13vw, 58px);
    line-height: 1;
    transform: rotate(-3deg);
  }

  .names {
    margin: 18px 0 0;
    font-size: 15px;
    letter-spacing: 0.14em;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .names__and {
    font-family: var(--hand);
    font-size: 22px;
    letter-spacing: 0;
    color: var(--soft);
  }

  /* Picture frame: a photographed black wood frame (Pixabay) whose white inside is the mat.
     The crop's thin wall margin fades into the page wall. */
  .frame {
    margin-top: 36px;
    width: min(82vw, 316px);
    max-width: 100%;
    aspect-ratio: 480 / 733;
    position: relative;
    background: url("textures/black-frame.jpg") center / 100% 100% no-repeat;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 3%, #000 97%, transparent), linear-gradient(to bottom, transparent, #000 2%, #000 98%, transparent);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to right, transparent, #000 3%, #000 97%, transparent), linear-gradient(to bottom, transparent, #000 2%, #000 98%, transparent);
    mask-composite: intersect;
  }

  /* The white inside of the photographed frame (measured from the source image). */
  .mat {
    position: absolute;
    left: 7.5%;
    top: 5.6%;
    width: 86%;
    height: 88.8%;
    display: grid;
    place-items: center;
  }

  /* White lace trim laid on the mat: scallops point inward at the top and bottom. */
  .lace {
    position: absolute;
    left: 0;
    right: 0;
    height: 13%;
    background: url("textures/lace-white.png") center / auto 100% repeat-x;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.12));
    pointer-events: none;
  }

  .lace--top {
    top: 4%;
  }

  .lace--bottom {
    bottom: 4%;
    transform: scaleY(-1);
  }

  .window {
    width: 54%;
    aspect-ratio: 2 / 3;
    position: relative;
    /* The bevel: a lit edge on the top and left, a shaded edge on the bottom and right. */
    box-shadow: 0 0 0 3px #ffffff, 0 0 0 4px rgba(0, 0, 0, 0.08), -1px -1px 0 4px rgba(255, 255, 255, 0.9), 1px 1px 0 5px rgba(0, 0, 0, 0.06);
    overflow: hidden;
  }

  .window img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(1) contrast(1.05);
  }

  /* Glass glare across the frame. */
  .window::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, 0.12) 42%, rgba(255, 255, 255, 0) 56%);
    pointer-events: none;
  }

  .details {
    margin: 44px 0 0;
    text-align: center;
    font-size: 14px;
    line-height: 1.9;
    letter-spacing: 0.02em;
  }

  .details__place {
    color: var(--soft);
  }
</style>

<main class="cover" aria-label="커버">
  <h1 class="title">우리, 결혼해요</h1>
  <p class="names">
    <span>서진용</span>
    <span class="names__and" aria-hidden="true">그리고</span>
    <span>장하림</span>
  </p>
  <div class="frame">
    <div class="mat">
      <span class="lace lace--top" aria-hidden="true"></span>
      <span class="lace lace--bottom" aria-hidden="true"></span>
      <div class="window">
        <img src="photos/photo-06.jpg" alt="서로에게 기대어 웃는 진용과 하림">
      </div>
    </div>
  </div>
  <p class="details">
    2027년 3월 6일 토요일 오후 5시<br>
    <span class="details__place">식물관PH</span>
  </p>
</main>
