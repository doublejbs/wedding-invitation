<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>진용·하림 두 사람</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="SectionKit.css">
<style>
  /* Families: right after the greeting. The two families stand side by side (groom left, bride right), each a
     torn-out photo with its parents and name below; the user found them stacked too empty. The user's second
     reference shows only the cutting; its envelope and hearts are not used. No letters or stickers either. */

  .families {
    position: relative;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-items: end;
    column-gap: 8px;
    padding-block: 64px 72px;
    text-align: center;
  }

  .families__family {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 0;
  }

  /* photo-10 and photo-09, kept by the couple, cut out with a white border (scripts/BuildCutouts.py).
     Both share one height so their feet line up; the width follows the person. One soft shadow below. */
  .families__cutout {
    display: block;
    width: auto;
    max-width: 100%;
    height: min(66vw, 260px);
    object-fit: contain;
    object-position: bottom;
    filter: drop-shadow(0 3px 5px rgba(40, 30, 20, 0.22));
  }

  /* Their own bouquet (photo-02), torn like the two photos, small in the gap at hand height: the groom's hands and
     the bride's raised elbow (SectionsSpec 2-1b). The section's top padding is 64px; 58% of the photo height below
     that. Higher, at the shoulders, the bride's raised arm leaves no room. Checked on 320, 390 and 430px phones not
     to touch either photo, even 4px around it. */
  .families__bouquet {
    position: absolute;
    left: 50%;
    top: calc(64px + min(66vw, 260px) * 0.58);
    width: 36px;
    height: auto;
    transform: translateX(calc(-50% - 4px)) rotate(-6deg);
    filter: drop-shadow(0 3px 5px rgba(40, 30, 20, 0.22));
    pointer-events: none;
  }

  .families__parents {
    margin: 16px 0 0;
    color: var(--soft);
    font-family: var(--korean);
    font-size: clamp(13px, 3.7vw, 15px);
    line-height: 1.6;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  .families__name {
    margin: 2px 0 0;
    color: var(--ink);
    font-family: var(--korean);
    font-size: clamp(17px, 5vw, 20px);
    font-weight: 500;
    line-height: 1.5;
    letter-spacing: -0.02em;
  }
</style>

<section class="section families" aria-label="두 사람">
  <img class="families__bouquet" src="photos/photo-02-bouquet-cut.webp" width="240" height="242" alt="" loading="lazy" decoding="async">

  <div class="families__family">
    <img class="families__cutout" src="photos/photo-10-cut.webp" width="348" height="800" loading="lazy" decoding="async" alt="들판에 홀로 선 신랑">
    <p class="families__parents">서재호 &amp; 김선교의</p>
    <p class="families__name">아들 진용</p>
  </div>

  <div class="families__family">
    <img class="families__cutout" src="photos/photo-09-cut.webp" width="537" height="800" loading="lazy" decoding="async" alt="들판에 홀로 선 신부">
    <p class="families__parents">장영인 &amp; 김혜숙의</p>
    <p class="families__name">딸 하림</p>
  </div>
</section>

<script src="SectionKit.js"></script>
