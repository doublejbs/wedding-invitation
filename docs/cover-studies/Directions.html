<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>진용·하림 오시는 길</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="SectionKit.css">
<style>
  /* Directions: in the cover's tone (tokens, container, title, pair and crayon link come from SectionKit.css).
     The place faces its address like the cover's date faces the time and place, then three map apps
     as plain underlined words, then the transit notes as text only. No map image: the tiles clash with the paper. */

  /* The lead sits on the address's last line, not on the bottom of the 44px tap target under it. */
  .directions__place {
    margin-bottom: max(8px, calc((44px - 1lh) / 2));
  }

  /* The kit's link inherits its font (it overrides .sub), so the cover's time-and-place type is set here
     again, at the same weight as 식물관PH on the left. The button keeps its two-line height while it reads
     복사했어요, and that word sits on the second line's place, so nothing below jumps.
     A two-line address in one button: each line carries its own crayon underline, so the button's own
     underline is turned off (also on focus) and the mark hugs the letters instead of the whole block. */
  .directions__address,
  .directions__address:focus-visible {
    background-image: none;
  }

  .directions__address {
    display: inline-flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    min-height: calc(2lh + 10px + 2 * max(8px, (44px - 1lh) / 2));
    font-family: var(--latin), var(--korean);
    font-weight: 500;
    font-size: clamp(18px, 5.2vw, 21px);
    line-height: 1.25;
    letter-spacing: -0.02em;
  }

  .directions__line {
    display: block;
    width: fit-content;
    margin-left: auto;
    padding-bottom: 3px;
    background-image: var(--crayon-underline);
    background-repeat: no-repeat;
    background-size: 100% 7px;
    background-position: left 0 bottom -3px;
  }

  .directions__line + .directions__line {
    margin-top: 4px;
  }

  .directions__address:focus-visible .directions__line {
    background-image: var(--crayon-underline-bloom);
  }

  /* Three map apps on one row, built like the title: the middle word on the center axis,
     the outer two flush with the place and the address above. */
  .directions__maps {
    margin: 22px 0 0;
    padding: 0;
    list-style: none;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    column-gap: 12px;
    font-size: 15px;
    word-break: keep-all;
  }

  .directions__maps li:first-child {
    justify-self: start;
  }

  .directions__maps li:nth-child(2) {
    justify-self: center;
  }

  .directions__maps li:last-child {
    justify-self: end;
  }

  /* On a computer the TMAP app link is hidden (see the script), so the two words left face each other
     on the column edges, like the place and the address above them. */
  .directions__maps--two {
    grid-template-columns: auto auto;
    justify-content: space-between;
  }

  .directions__maps--two li:nth-child(2) {
    justify-self: end;
  }

  /* Transit notes: a small soft name, its sentence right under it, space between items and nothing else. */
  .directions__transit {
    margin: 44px 0 0;
    display: grid;
    row-gap: 24px;
  }

  .directions__item {
    margin: 0;
  }

  .directions__item .label {
    display: block;
    margin-bottom: 2px;
    line-height: 1.6;
  }

  .directions__item .prose {
    display: block;
    text-align: left;
    line-height: 1.75;
  }
</style>

<section class="section directions" aria-label="오시는 길">

      <path d="M8.5 29.5 C 10.5 28, 12.5 27.5, 14.5 28 M39.5 30 C 37.5 28.5, 35.5 28.2, 33.5 28.6 M23 19.6 C 20 18.8, 17 19.3, 15 20.8 M25 19.4 C 28 18.6, 31 19, 33 20.4" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="0.6" stroke-linecap="round"/>
      <!-- Frame: gable outline and base in two loose pencil passes, then thinner mullions and bars. -->

      <path d="M5 16.3 C 17 15.8, 31 16.6, 43.1 16.1 M11.4 33 L11.3 12 M17.7 33 L17.8 8.1 M24 33 L24.1 4 M30.3 33 L30.2 8.2 M36.6 33 L36.7 12.1 M5.1 26.6 C 17 26.2, 31 26.9, 42.9 26.5 M14.6 10.1 C 21 9.8, 27 10.3, 33.6 10" fill="none" stroke="#3a3a37" stroke-width="0.6" stroke-linecap="round" opacity="0.45"/>
    </svg>
    <span class="section-title__right" aria-hidden="true">오시는 길</span>
  </h2>

  <div class="pair">
    <p class="lead directions__place">식물관PH</p>
    <!-- TODO: confirm address of 식물관PH (data-copy, aria-label and both lines). -->
    <button class="crayon-link sub directions__address" type="button" data-copy="서울 강남구 광평로34길 24" aria-label="주소 복사: 서울 강남구 광평로34길 24"><span class="directions__line">서울 강남구</span><span class="directions__line">광평로34길 24</span></button>
  </div>

  <ul class="directions__maps" aria-label="지도 앱으로 보기">
    <li><a class="crayon-link" data-map="naver" href="https://map.naver.com/p/search/%EC%8B%9D%EB%AC%BC%EA%B4%80PH" target="_blank" rel="noopener">네이버 지도</a></li>
    <li><a class="crayon-link" data-map="kakao" href="https://map.kakao.com/link/search/%EC%8B%9D%EB%AC%BC%EA%B4%80PH" target="_blank" rel="noopener">카카오맵</a></li>
    <li data-map-app-only><a class="crayon-link" data-map="tmap" href="tmap://search?name=%EC%8B%9D%EB%AC%BC%EA%B4%80PH">티맵</a></li>
  </ul>

  <!-- TODO: fill in the transit details from the venue (station, exit, walk time, bus stop and lines, parking).
       Add a 셔틀 item in the same form if there is a shuttle bus. -->
  <div class="directions__transit">
    <p class="directions__item">
      <span class="label">지하철</span>
      <span class="prose">○○선 ○○역 ○번 출구에서 걸어서 ○분입니다.</span>
    </p>
    <p class="directions__item">
      <span class="label">버스</span>
      <span class="prose">○○○ 정류장에서 내리시면 걸어서 ○분입니다.<br>간선 ○○○, 지선 ○○○○</span>
    </p>
    <p class="directions__item">
      <span class="label">주차</span>
      <span class="prose">건물 주차장을 이용하실 수 있고, ○시간 무료입니다.</span>
    </p>
  </div>
</section>

<script src="SectionKit.js"></script>
<script>
  // TMAP opens only through its app link (tmap://), which errors on a computer. With a mouse-like pointer
  // the word is hidden but kept in the DOM; without matchMedia nothing changes.
  (() => {
    const DESKTOP_QUERY = '(hover: hover) and (pointer: fine)';
    const maps = document.querySelector('.directions .directions__maps');
    const appOnlyItem = maps ? maps.querySelector('[data-map-app-only]') : null;

    if (!appOnlyItem || typeof window.matchMedia !== 'function') {
      return;
    }

    if (!window.matchMedia(DESKTOP_QUERY).matches) {
      return;
    }

    appOnlyItem.hidden = true;
    maps.classList.add('directions__maps--two');
  })();
</script>
