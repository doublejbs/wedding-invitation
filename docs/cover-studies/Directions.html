<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>진용·하림 오시는 길</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="SectionKit.css">
<style>
  /* Directions: laid out like the ceremony (tokens, title, pills and the copy word come from SectionKit.css).
     One centred column: a still Naver map with one pin on the venue (its script loads only near the viewport),
     the place, the address that copies itself, three map apps as outline pills, then the transit notes. */

  /* Same size before and after the map loads, so nothing below moves; hidden if the map cannot load. */
  .directions__map {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    margin: 0 0 28px;
    border: 0;
    background: color-mix(in srgb, var(--ink) 5%, transparent);
  }

  .directions__map[hidden] {
    display: none;
  }

  /* One line that copies itself. 복사했어요 is shorter and stays on the same line, so nothing below moves. */
  .directions__address {
    margin: 2px 0 0;
    font-size: 15px;
    letter-spacing: -0.01em;
  }

  .directions__address .crayon-link {
    white-space: nowrap;
  }

  /* Three outline pills on one row. Narrower sides than the kit's so all three fit 272px at 320px wide;
     on a computer the TMAP item is hidden (see the script) and the other two stay centred. */
  .directions__maps {
    margin: 20px 0 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }

  .directions__maps .pill {
    padding-inline: 14px;
  }

  /* Transit notes: a small soft name, its sentence right under it, space between items and nothing else. */
  .directions__transit {
    margin: 48px 0 0;
    display: grid;
    row-gap: 24px;
  }

  .directions__item {
    margin: 0;
  }

  .directions__item .label {
    display: block;
    line-height: 1.6;
  }

  .directions__item .prose {
    display: block;
    color: var(--ink);
  }
</style>

<section class="section section--detail directions" aria-label="오시는 길">
  <h2 class="section-title">오시는 길</h2>
  <!-- If the venue changes, change VENUE_POSITION in the script together with data-copy, the aria-label and the text below. -->
  <div class="directions__map" data-naver-map role="region" aria-label="식물관PH 위치 지도"></div>

  <p class="lead directions__place">식물관PH</p>
  <p class="directions__address">
    <button class="crayon-link" type="button" data-copy="서울 강남구 광평로34길 24" aria-label="주소 복사: 서울 강남구 광평로34길 24">서울 강남구 광평로34길 24</button>
  </p>

  <ul class="directions__maps" aria-label="지도 앱으로 보기">
    <li><a class="pill pill--line" data-map="naver" href="https://map.naver.com/p/search/%EC%8B%9D%EB%AC%BC%EA%B4%80PH" target="_blank" rel="noopener">네이버 지도</a></li>
    <li><a class="pill pill--line" data-map="kakao" href="https://map.kakao.com/link/search/%EC%8B%9D%EB%AC%BC%EA%B4%80PH" target="_blank" rel="noopener">카카오맵</a></li>
    <li data-map-app-only><a class="pill pill--line" data-map="tmap" href="tmap://search?name=%EC%8B%9D%EB%AC%BC%EA%B4%80PH">티맵</a></li>
  </ul>

  <!-- TODO: fill in the transit details from the venue (station, exit, walk time, bus stop and lines, parking).
       Add a 셔틀 item in the same form if there is a shuttle bus. -->
  <div class="directions__transit">
    <p class="directions__item">
      <span class="label">지하철</span>
      <span class="prose">○○선 ○○역 ○번 출구에서 걸어서 ○분입니다.</span>
    </p>
    <p class="directions__item">
      <span class="label">버스</span>
      <span class="prose">○○○ 정류장에서 내리시면 걸어서 ○분입니다.<br>간선 ○○○, 지선 ○○○○</span>
    </p>
    <p class="directions__item">
      <span class="label">주차</span>
      <span class="prose">건물 주차장을 이용하실 수 있고, ○시간 무료입니다.</span>
    </p>
  </div>
</section>

<script src="SectionKit.js"></script>
<script>
  // TMAP opens only through its app link (tmap://), which errors on a computer. With a mouse-like pointer
  // its pill is hidden but kept in the DOM (the row stays centred); without matchMedia nothing changes.
  (() => {
    const DESKTOP_QUERY = '(hover: hover) and (pointer: fine)';
    const maps = document.querySelector('.directions .directions__maps');
    const appOnlyItem = maps ? maps.querySelector('[data-map-app-only]') : null;

    if (!appOnlyItem || typeof window.matchMedia !== 'function') {
      return;
    }

    if (!window.matchMedia(DESKTOP_QUERY).matches) {
      return;
    }

    appOnlyItem.hidden = true;
  })();

  // NAVER Maps v3: the script loads once, only when the box comes near the viewport. The client ID is public
  // and works only on the web service URLs registered for it. If the map cannot load, only the box is hidden.
  (() => {
    const NAVER_MAP_CLIENT_ID = 'p3b51v6ck2';
    const NAVER_MAP_SCRIPT_URL = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + NAVER_MAP_CLIENT_ID;
    const VENUE_POSITION = { lat: 37.4826902, lng: 127.0943672 };
    const MAP_ZOOM = 16;
    const LOAD_MARGIN = '600px 0px';
    const box = document.querySelector('.directions [data-naver-map]');

    if (!box) {
      return;
    }

    let isRequested = false;

    const hideMap = () => {
      box.hidden = true;
    };

    const handleScriptLoad = () => {
      const maps = window.naver && window.naver.maps;

      if (!maps) {
        hideMap();

        return;
      }

      const position = new maps.LatLng(VENUE_POSITION.lat, VENUE_POSITION.lng);
      // Still map: dragging and wheel would catch the page scroll; only the zoom buttons stay.
      const map = new maps.Map(box, {
        center: position,
        zoom: MAP_ZOOM,
        draggable: false,
        pinchZoom: false,
        scrollWheel: false,
        keyboardShortcuts: false,
        disableDoubleClickZoom: true,
        disableDoubleTapZoom: true,
        disableTwoFingerTapZoom: true,
        zoomControl: true,
        zoomControlOptions: {
          position: maps.Position.TOP_RIGHT,
          style: maps.ZoomControlStyle.SMALL,
        },
        scaleControl: false,
        mapDataControl: false,
      });

      new maps.Marker({ position, map });
    };

    const handleScriptError = () => {
      hideMap();
    };

    const loadScript = () => {
      if (isRequested) {
        return;
      }

      isRequested = true;

      const script = document.createElement('script');

      script.src = NAVER_MAP_SCRIPT_URL;
      script.async = true;
      script.addEventListener('load', handleScriptLoad);
      script.addEventListener('error', handleScriptError);
      document.head.appendChild(script);
    };

    // The API calls this global when the client ID is rejected (e.g. an unregistered domain).
    window.navermap_authFailure = hideMap;

    if (typeof window.IntersectionObserver !== 'function') {
      loadScript();

      return;
    }

    // observer is declared below; the callback only runs after it exists.
    const handleIntersect = (entries) => {
      const isNear = entries.some((entry) => entry.isIntersecting);

      if (!isNear) {
        return;
      }

      observer.disconnect();
      loadScript();
    };

    const observer = new IntersectionObserver(handleIntersect, { rootMargin: LOAD_MARGIN });

    observer.observe(box);
  })();
</script>
