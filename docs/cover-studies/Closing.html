<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>진용·하림 마무리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="SectionKit.css">
<style>
  /* Closing: the greeting's twin on black paper: one stamp, the last words, then two pills. No title, no drawing. */
  .closing {
    padding-top: 80px;
    padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px));
  }

  /* The greeting's stamp at the same size, with one photo in the whole window. */
  .closing__stamp {
    position: relative;
    width: clamp(86px, 25.6vw, 112px);
    aspect-ratio: 595 / 860;
    margin: 0 auto 52px;
  }

  .closing__frame {
    display: block;
    width: 100%;
    height: 100%;
  }

  .closing__window {
    position: absolute;
    top: 7.209%;
    left: 10.420%;
    width: 79.160%;
    height: 85.582%;
    overflow: hidden;
  }

  /* photo-06-sm (534 x 800), source x 126-446, y 300-800: both heads down to the bouquet. */
  .closing__photo {
    position: absolute;
    top: -59.9%;
    left: -39.375%;
    display: block;
    width: 166.875%;
    max-width: none;
    height: auto;
  }

  .closing .prose {
    color: var(--ink);
  }

  /* Two pills stacked on the centre axis: share filled on top, copy outlined under it (both swap to paper here).
     Each has its own row, so the copy feedback only changes the copy pill's width: the share pill never moves.
     Without the system share sheet the share pill is hidden and the copy pill stays centred alone. */
  .closing__share {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
</style>

<section class="section section--detail section--dark closing" data-tone="dark" aria-label="마무리">
  <div class="closing__stamp" data-stamp>
    <img class="closing__frame" src="textures/stamp-frame.png" width="595" height="860" loading="lazy" decoding="async" alt="">
    <span class="closing__window">
      <img class="closing__photo" src="photos/photo-06-sm.jpg" width="534" height="800" loading="lazy" decoding="async" alt="신랑에게 기대어 웃는 신부">
    </span>
  </div>

  <!-- Draft wording: the closing sentence is not confirmed yet. -->
  <p class="prose">
    귀한 걸음으로 함께해 주시는<br>
    모든 분께 고맙습니다.<br>
    오래도록 다정하게 살겠습니다.
  </p>

  <div class="closing__share">
    <button class="pill" type="button" data-share>청첩장 보내기</button>
    <button class="pill pill--line" type="button" data-copy-url>주소 복사</button>
  </div>
</section>

<script src="SectionKit.js"></script>
<script>
  // Share: opens the system share sheet with the invitation's title, date and address.
  // Copying the address is handled by SectionKit.js (data-copy-url).
  (() => {
    const SHARE_TITLE = '서진용 · 장하림 결혼합니다';
    const SHARE_TEXT = '2027년 3월 6일 토요일 오후 5시, 식물관PH';
    const shareButton = document.querySelector('.closing button[data-share]');

    if (!shareButton) {
      return;
    }

    // No share sheet (most desktop browsers): keep the button in the DOM but hidden; the copy pill stays centred.
    if (typeof navigator.share !== 'function') {
      shareButton.hidden = true;

      return;
    }

    // Closing the sheet rejects with AbortError, and a second tap while it is open with InvalidStateError;
    // neither is a failure worth showing.
    const QUIET_ERRORS = ['AbortError', 'InvalidStateError'];
    let isSharing = false;

    const handleShareClick = async () => {
      if (isSharing) {
        return;
      }

      isSharing = true;

      try {
        await navigator.share({ title: SHARE_TITLE, text: SHARE_TEXT, url: window.location.href });
      } catch (error) {
        if (error && QUIET_ERRORS.includes(error.name)) {
          return;
        }

        // Any other refusal: fall back to copying the address, which shows its own feedback.
        const copyButton = document.querySelector('.closing button[data-copy-url]');

        if (copyButton) {
          copyButton.click();
        }
      } finally {
        isSharing = false;
      }
    };

    shareButton.addEventListener('click', handleShareClick);
  })();
</script>
