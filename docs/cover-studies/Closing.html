<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>진용·하림 마무리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="SectionKit.css">
<style>
  /* Closing: the last sheet: a toast drawing and the hand-lettered 고맙습니다,
     then one short sentence and a pair of share words. Nothing after that but paper. */

  /* The last page ends on generous empty paper, clear of the home indicator. */
  .closing {
    padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px));
  }

  /* Share words face each other, pulled in from the edges like the greeting's signature row.
     The inset shrinks on narrow screens and the words never wrap, so 청첩장 보내기 stays on one line at 320px. */
  .closing__share {
    margin-top: 40px;
    padding-inline: clamp(0px, 12%, 80px);
    font-size: 15px;
    letter-spacing: -0.01em;
  }

  .closing__share > .crayon-link {
    white-space: nowrap;
  }

  /* Without the system share sheet only the copy word is left; it moves to the center axis. */
  .closing__share--solo {
    justify-content: center;
  }

  .closing__share--solo > :last-child {
    justify-self: center;
  }
</style>

<section class="section section--detail closing" aria-label="마무리">
  <svg class="crayon-art" data-illustration viewBox="0 0 120 100" aria-hidden="true">
    <!-- Two glasses meeting in a toast, with three short strokes where they touch. -->
    <g>
      <path d="M29.6 20.4 C 27.6 34, 33.4 46.4, 45.6 48.2 C 56 46.6, 60.4 34.4, 57 18.4 C 47.6 19.8, 38.6 20.6, 29.6 20.4 Z"/>
      <path d="M90.4 20.4 C 92.4 34, 86.6 46.4, 74.4 48.2 C 64 46.6, 59.6 34.4, 63 18.4 C 72.4 19.8, 81.4 20.6, 90.4 20.4 Z"/>
      <path stroke="#c9a24d" d="M31 30.4 C 40 32.4, 50 31.6, 57.6 28.4 M89 30.4 C 80 32.4, 70 31.6, 62.4 28.4"/>
      <path d="M45.6 48.2 C 46.2 57, 46.8 66, 47.6 76.4 M38 78.6 C 44 76.4, 51.6 76.2, 58 78.4 M74.4 48.2 C 73.8 57, 73.2 66, 72.4 76.4 M62 78.4 C 68.4 76.2, 76 76.4, 82 78.6"/>
      <path stroke="#c9a24d" d="M60 11.4 L 60.2 3.6 M52.6 12 L 48.4 5.4 M67.4 12 L 71.6 5.4"/>
    </g>
    <!-- Second, lighter crayon pass, a hair off the first. -->
    <g transform="translate(0.7 0.6)" stroke-width="0.8" opacity="0.35">
      <path fill="none" d="M29.6 20.4 C 27.6 34, 33.4 46.4, 45.6 48.2 C 56 46.6, 60.4 34.4, 57 18.4 C 47.6 19.8, 38.6 20.6, 29.6 20.4 Z"/>
      <path fill="none" d="M90.4 20.4 C 92.4 34, 86.6 46.4, 74.4 48.2 C 64 46.6, 59.6 34.4, 63 18.4 C 72.4 19.8, 81.4 20.6, 90.4 20.4 Z"/>
      <path fill="none" stroke="#c9a24d" d="M31 30.4 C 40 32.4, 50 31.6, 57.6 28.4 M89 30.4 C 80 32.4, 70 31.6, 62.4 28.4"/>
      <path fill="none" d="M45.6 48.2 C 46.2 57, 46.8 66, 47.6 76.4 M38 78.6 C 44 76.4, 51.6 76.2, 58 78.4 M74.4 48.2 C 73.8 57, 73.2 66, 72.4 76.4 M62 78.4 C 68.4 76.2, 76 76.4, 82 78.6"/>
      <path fill="none" stroke="#c9a24d" d="M60 11.4 L 60.2 3.6 M52.6 12 L 48.4 5.4 M67.4 12 L 71.6 5.4"/>
    </g>
  </svg>
  <h2 class="section-title">고맙습니다</h2>

  <!-- Draft wording: the closing sentence is not confirmed yet. -->
  <p class="prose">
    귀한 걸음으로 함께해 주시는<br>
    모든 분께 고맙습니다.<br>
    오래도록 다정하게 살겠습니다.
  </p>

  <div class="pair closing__share">
    <button class="crayon-link" type="button" data-share>청첩장 보내기</button>
    <button class="crayon-link" type="button" data-copy-url>주소 복사</button>
  </div>
</section>

<script src="SectionKit.js"></script>
<script>
  // Share: opens the system share sheet with the invitation's title, date and address.
  // Copying the address is handled by SectionKit.js (data-copy-url).
  (() => {
    const SHARE_TITLE = '서진용 · 장하림 결혼합니다';
    const SHARE_TEXT = '2027년 3월 6일 토요일 오후 5시, 식물관PH';
    const shareButton = document.querySelector('.closing button[data-share]');
    const shareRow = document.querySelector('.closing .closing__share');

    if (!shareButton) {
      return;
    }

    // No share sheet (most desktop browsers): keep the button in the DOM but hidden, copy word centered.
    if (typeof navigator.share !== 'function') {
      shareButton.hidden = true;

      if (shareRow) {
        shareRow.classList.add('closing__share--solo');
      }

      return;
    }

    // Closing the sheet rejects with AbortError, and a second tap while it is open with InvalidStateError;
    // neither is a failure worth showing.
    const QUIET_ERRORS = ['AbortError', 'InvalidStateError'];
    let isSharing = false;

    const handleShareClick = async () => {
      if (isSharing) {
        return;
      }

      isSharing = true;

      try {
        await navigator.share({ title: SHARE_TITLE, text: SHARE_TEXT, url: window.location.href });
      } catch (error) {
        if (error && QUIET_ERRORS.includes(error.name)) {
          return;
        }

        // Any other refusal: fall back to copying the address, which shows its own feedback.
        const copyButton = document.querySelector('.closing button[data-copy-url]');

        if (copyButton) {
          copyButton.click();
        }
      } finally {
        isSharing = false;
      }
    };

    shareButton.addEventListener('click', handleShareClick);
  })();
</script>
